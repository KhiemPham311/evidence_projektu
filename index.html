<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Evidence projektů SEA-l</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>

/* Paleta podle sea-l.cz: teplý přechod od bílé k mangově oranžové, uhlové tlačítka, šedá kresba. */
:root{
  --bg:#fff8f1; --surface:#ffffff; --line:#eddfd1; --ink:#2b2724; --muted:#6e645a;
  --brand:#ef7d3c; --brand-ink:#b4501a; --mango:#f3b229; --cream:#fbefc6; --soft:#fde6d3;
  --btn:#333333; --btn-ink:#ffffff;
  --good:#2c7a4b; --good-bg:#e2f2e7; --warn:#935f00; --warn-bg:#fdefc9; --bad:#b0362e; --bad-bg:#fbe0dc; --idle-bg:#f2ebe4;
  --head:linear-gradient(115deg,#ffffff 0%,#fde9d8 45%,#f9c08f 80%,#f59a5f 100%);
  --font:"Open Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --r:6px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#1c1916; --surface:#25211d; --line:#3a332c; --ink:#f3ece4; --muted:#b4a797;
    --brand:#f39a5e; --brand-ink:#f6a875; --mango:#f3b229; --cream:#3a3020; --soft:#3b2a1f;
    --btn:#f3ece4; --btn-ink:#1c1916;
    --good:#74d29b; --good-bg:#183526; --warn:#f2c35a; --warn-bg:#3b2f12; --bad:#f28c82; --bad-bg:#40201c; --idle-bg:#2e2924;
    --head:linear-gradient(115deg,#25211d 0%,#3a2a1f 55%,#6b3a1d 100%);
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#1c1916; --surface:#25211d; --line:#3a332c; --ink:#f3ece4; --muted:#b4a797;
  --brand:#f39a5e; --brand-ink:#f6a875; --mango:#f3b229; --cream:#3a3020; --soft:#3b2a1f;
  --btn:#f3ece4; --btn-ink:#1c1916;
  --good:#74d29b; --good-bg:#183526; --warn:#f2c35a; --warn-bg:#3b2f12; --bad:#f28c82; --bad-bg:#40201c; --idle-bg:#2e2924;
  --head:linear-gradient(115deg,#25211d 0%,#3a2a1f 55%,#6b3a1d 100%);
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:15.5px;line-height:1.5;-webkit-text-size-adjust:100%}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--mango);outline-offset:2px}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}

header{background:var(--head);border-bottom:1px solid var(--line)}
.head-in,.wrap{max-width:1120px;margin:0 auto;padding:0 16px}
.top{display:flex;align-items:center;gap:14px;padding:16px 0 12px;flex-wrap:wrap}
.logo{width:42px;height:42px;border-radius:50%;background:var(--btn);color:var(--btn-ink);display:grid;place-items:center;font-weight:700;font-size:.8rem;letter-spacing:.04em;flex:none}
.title h1{font-size:1.35rem;font-weight:600;margin:0;letter-spacing:.02em}
.title p{margin:0;color:var(--muted);font-size:.85rem;letter-spacing:.06em}
.sync{margin-left:auto;font-size:.82rem;display:flex;align-items:center;gap:6px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:4px 12px;cursor:pointer}
.sync i{width:8px;height:8px;border-radius:50%;background:var(--muted);display:inline-block}
.sync.ok i{background:var(--good)} .sync.busy i{background:var(--mango)} .sync.err i{background:var(--bad)}
nav{display:flex;gap:6px;overflow-x:auto;padding-bottom:12px;scrollbar-width:none}
nav::-webkit-scrollbar{display:none}
nav a{color:var(--ink);text-decoration:none;padding:8px 14px;border-radius:3px;font-weight:600;font-size:.9rem;letter-spacing:.04em;white-space:nowrap;background:rgba(255,255,255,.55)}
nav a:hover{background:var(--surface)}
nav a[aria-current="page"]{background:var(--btn);color:var(--btn-ink)}
:root[data-theme="dark"] nav a:not([aria-current="page"]){background:rgba(0,0,0,.25)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) nav a:not([aria-current="page"]){background:rgba(0,0,0,.25)}}

.wrap{padding-top:20px;padding-bottom:70px}
.bar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.bar .grow{flex:1 1 220px}
.bar .w{flex:0 1 200px}
input[type=text],input[type=search],input[type=number],input[type=date],input[type=month],input[type=tel],input[type=email],input[type=time],input[type=password],select,textarea{
  background:var(--surface);border:1.5px solid var(--line);border-radius:var(--r);padding:9px 11px;min-height:42px;width:100%}
textarea{resize:vertical;min-height:64px}
input:focus,select:focus,textarea:focus{border-color:var(--brand)}
.btn{border:1.5px solid var(--line);background:var(--surface);border-radius:3px;padding:9px 15px;min-height:42px;font-weight:600;letter-spacing:.03em;cursor:pointer;white-space:nowrap}
.btn:hover{border-color:var(--brand)}
.btn.primary{background:var(--btn);color:var(--btn-ink);border-color:var(--btn)}
.btn.primary:hover{background:var(--brand-ink);border-color:var(--brand-ink);color:#fff}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn.small{min-height:34px;padding:5px 10px;font-size:.85rem}
.btn:disabled{opacity:.5;cursor:default}
a.btn{color:var(--ink);text-decoration:none;display:inline-flex;align-items:center;justify-content:center}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1.5px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 13px;cursor:pointer;font-size:.88rem;font-weight:500}
.chip[aria-pressed="true"]{background:var(--soft);border-color:var(--brand);color:var(--brand-ink);font-weight:700}

.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px;margin-bottom:18px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;border-top:4px solid var(--mango)}
.tile.o{border-top-color:var(--brand)} .tile.g{border-top-color:var(--good)} .tile.r{border-top-color:var(--bad)} .tile.c{border-top-color:var(--btn)}
.tile b{display:block;font-size:1.45rem;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.25}
.tile span{color:var(--muted);font-size:.84rem}
h2{font-size:1.08rem;font-weight:700;letter-spacing:.02em;margin:26px 0 10px;text-wrap:balance;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
h2 .sub{font-weight:400}
.sheet{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.row{display:grid;gap:10px;align-items:center;padding:10px 14px;border-top:1px solid var(--line)}
.row:first-child{border-top:0}
.row.head{font-size:.74rem;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:700;background:var(--bg)}
.row.click{cursor:pointer}
.row.click:hover{background:var(--soft)}
.num{color:var(--muted);font-variant-numeric:tabular-nums;font-size:.88rem}
.name{font-weight:600;overflow-wrap:anywhere}
.sub{color:var(--muted);font-size:.84rem;overflow-wrap:anywhere}
.money{font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap}
.pill{display:inline-block;border-radius:999px;padding:2px 10px;font-size:.78rem;font-weight:700;white-space:nowrap}
.pill.good{background:var(--good-bg);color:var(--good)} .pill.warn{background:var(--warn-bg);color:var(--warn)}
.pill.bad{background:var(--bad-bg);color:var(--bad)} .pill.idle{background:var(--idle-bg);color:var(--muted)}
.pill.tag{background:var(--cream);color:var(--ink);font-weight:600}
.row input,.row select{min-height:36px;padding:5px 8px}
.empty{padding:26px 16px;text-align:center;color:var(--muted)}
.hint{color:var(--muted);font-size:.86rem;margin:8px 2px 0}
.note{background:var(--cream);border:1px solid var(--mango);border-radius:var(--r);padding:10px 14px;margin-bottom:16px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.note.bad{background:var(--bad-bg);border-color:var(--bad);color:var(--bad)}
.note .grow{flex:1 1 260px}
.scroll{overflow-x:auto}

.c-btns{display:flex;gap:6px;justify-content:flex-end}
.ritems{margin:4px 0 8px}.ritem{display:flex;align-items:center;gap:10px;padding:8px 12px;border-top:1px solid var(--line)}.ritem:first-child{border-top:0}.ritem .name{flex:1;color:var(--ink)}
.ritem input{width:6.5rem;text-align:right}.ritem .mini{display:flex;align-items:center;gap:6px}
.rtotal{display:flex;flex-direction:column;gap:2px;padding:10px 12px;background:var(--soft);border-radius:8px}.rtotal b{font-size:1.3rem}.rtotal span{color:var(--muted);font-size:.86rem}
.form .chk{display:flex;flex-direction:row;align-items:center;gap:8px;color:var(--ink);font-weight:500}
.od{position:relative;box-sizing:border-box;height:279mm;overflow:hidden;padding:2mm 8mm;font-size:10pt;line-height:1.45;color:#111;break-after:page;page-break-after:always}
.od:last-child{break-after:auto;page-break-after:auto}
.od i{font-style:normal;color:#1d3fa6;font-family:"Segoe Print","Bradley Hand","Comic Sans MS",cursive;font-size:11pt}
.od .o{display:inline-block;border:1.6px solid #1d3fa6;border-radius:50%;padding:0 3px;margin:-2px -1px;line-height:1.15}
.od .f{border-bottom:1px dotted #999;min-height:1.2em;display:inline-block;padding:0 2mm}.od .f.m{min-width:40mm}.od .f.c{min-width:35mm;text-align:center}
.od p{margin:2mm 0;text-align:justify}.od-b{font-weight:700;margin-top:3mm}.od-line{margin:3mm 0}
.as{box-sizing:border-box;padding:2mm 4mm;color:#111;font-size:10pt;break-after:page;page-break-after:always}.as:last-child{break-after:auto;page-break-after:auto}
.as-h{display:flex;justify-content:space-between;align-items:flex-start;gap:6mm;margin-bottom:4mm}.as-h h1{font-size:16pt;margin:0}.as-sub{font-size:10.5pt;color:#333;margin-top:1mm}
.as-t{width:100%;border-collapse:collapse;table-layout:fixed}
.as-t th,.as-t td{border:1px solid #555;height:8.5mm;text-align:center;vertical-align:middle;padding:0 1mm;font-size:10pt;overflow:hidden}
.as-t th{background:#f1ede7;font-size:9pt;line-height:1.15}.as-t th small{display:block;font-weight:400;color:#444}
.as-t .nm{text-align:left;white-space:nowrap;text-overflow:ellipsis}.as-t .n{color:#555;font-size:9pt}.as-t .sm{font-size:9pt}
.as-t tfoot td{height:12mm}.as-t tfoot .nt{font-size:7.5pt;line-height:1.1;height:auto;padding:1mm}
.as-t .m-P{font-size:12pt}.as-t .m-N{font-size:12pt;color:#b3261e}.as-t .m-O{font-weight:700;color:#555}
.as-leg{margin-top:3mm;font-size:9pt;color:#444}
.cats{display:grid;gap:2px;padding:6px 0}
.cat{display:grid;grid-template-columns:minmax(0,11rem) minmax(0,1fr) 6.5rem;gap:10px;align-items:center;padding:7px 14px;border:0;background:none;font:inherit;color:inherit;text-align:left;cursor:pointer;border-radius:8px}
.cat:hover,.cat[aria-pressed="true"]{background:var(--soft,rgba(0,0,0,.05))}
.cat .track{height:10px;border-radius:5px;background:rgba(0,0,0,.06);overflow:hidden}
.cat .track i{display:block;height:100%;background:var(--brand);border-radius:5px}
.cat b{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.exp-total{display:flex;justify-content:space-between;padding:10px 14px;font-weight:700;border-top:1px solid var(--line,rgba(0,0,0,.1))}
table.work td,table.work th{padding:4px 6px;vertical-align:middle}
table.grid.work th.r,table.grid.work td.r{text-align:center}
table.work td{text-align:center}
table.work td:first-child,table.work td:nth-child(2),table.work td:last-child{text-align:left}
table.work input{width:4.4rem;min-height:32px;padding:3px 6px;text-align:center;font-variant-numeric:tabular-nums}
table.work input.wn{width:100%;min-width:9rem;text-align:left}
table.work tr.we td{background:var(--bg)}
table.work tr.today td{background:var(--cream)}
table.work tr.tot td{font-weight:700;border-top:2px solid var(--line)}

.courses{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:grid;gap:8px;cursor:pointer;text-align:left}
.card:hover{border-color:var(--brand)}
.card.col{border-top:5px solid var(--cc)}
.swatches{display:flex;gap:8px;flex-wrap:wrap}
.swatches label{display:flex;align-items:center;gap:6px;font-weight:500;color:var(--ink)}
.swatches i{width:18px;height:18px;border-radius:50%;display:inline-block;border:1px solid var(--line)}
.card h3{margin:0;font-size:1.02rem;font-weight:700}
.card .meta{color:var(--muted);font-size:.86rem}
.cap{display:grid;gap:4px}
.cap .track{height:10px}
.track{background:var(--idle-bg);border-radius:999px;overflow:hidden;height:14px}
.fill{height:100%;background:var(--mango);border-radius:999px}
.fill.full{background:var(--brand)} .fill.over{background:var(--bad)}
.cap-line{display:flex;justify-content:space-between;font-size:.84rem;font-variant-numeric:tabular-nums}


.seg{display:inline-flex;border:1.5px solid var(--line);border-radius:4px;overflow:hidden}
.seg button{border:0;background:var(--surface);padding:7px 12px;min-height:38px;cursor:pointer;font-weight:600;border-left:1.5px solid var(--line)}
.seg button:first-child{border-left:0}
.seg button[aria-pressed="true"].P{background:var(--good-bg);color:var(--good)}
.seg button[aria-pressed="true"].N{background:var(--bad-bg);color:var(--bad)}
.seg button[aria-pressed="true"].O{background:var(--warn-bg);color:var(--warn)}

.monthnav{display:flex;align-items:center;gap:6px}
.monthnav strong{font-size:1.08rem;min-width:9.5rem;text-align:center;font-weight:700}

table.grid{border-collapse:collapse;width:100%;font-size:.88rem}
table.grid th,table.grid td{padding:7px 9px;border-top:1px solid var(--line);text-align:left;white-space:nowrap}
table.grid thead th{background:var(--bg);color:var(--muted);font-size:.74rem;text-transform:uppercase;letter-spacing:.06em;border-top:0}
table.grid td.r,table.grid th.r{text-align:right;font-variant-numeric:tabular-nums}

.chart{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px}
.chart svg{display:block;width:100%;height:auto}
.legend{display:flex;gap:16px;font-size:.84rem;color:var(--muted);margin-bottom:6px;flex-wrap:wrap}
.legend i{display:inline-block;width:12px;height:12px;border-radius:2px;margin-right:6px;vertical-align:-1px}

.overlay{position:fixed;inset:0;background:rgba(30,20,12,.5);display:none;align-items:flex-start;justify-content:center;padding:24px 12px;overflow-y:auto;z-index:20}
.overlay.open{display:flex}
.dialog{background:var(--surface);border-radius:10px;padding:20px;width:100%;max-width:600px;border:1px solid var(--line);border-top:5px solid var(--brand)}
.dialog h3{font-size:1.2rem;margin:0 0 14px;font-weight:700}
.form{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.form label,.form .lbl{display:grid;gap:4px;font-size:.84rem;font-weight:600;color:var(--muted)}
.form .full{grid-column:1/-1}
.checks{display:grid;gap:6px;max-height:220px;overflow:auto;border:1.5px solid var(--line);border-radius:var(--r);padding:8px 10px}
.checks label{display:flex;align-items:center;gap:8px;font-weight:500;color:var(--ink);font-size:.92rem}
.checks label.dis{color:var(--muted)}
.inline{display:flex;flex-wrap:wrap;gap:6px 16px}
.inline label{display:flex;align-items:center;gap:6px;font-weight:500;color:var(--ink);font-size:.92rem}
input[type=checkbox]{width:18px;height:18px;accent-color:var(--brand-ink);flex:none}
.actions{display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap;margin-top:18px}
.actions .left{margin-right:auto}
.err{color:var(--bad);font-size:.88rem;margin:10px 0 0;min-height:1em}
.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--btn);color:var(--btn-ink);padding:10px 16px;border-radius:6px;font-weight:600;display:none;z-index:30;max-width:92vw}
.toast.show{display:block}
.welcome{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:26px;display:grid;gap:14px;max-width:720px}
.welcome h2{margin:0;font-size:1.4rem}
.welcome .acts{display:flex;gap:10px;flex-wrap:wrap}
.settings{display:grid;gap:16px;max-width:760px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.panel h3{margin:0 0 4px;font-size:1.02rem}
.panel p{margin:0 0 12px;color:var(--muted);font-size:.9rem}
.list-plain{margin:0;padding-left:18px;color:var(--muted);font-size:.9rem}

@media (max-width:820px){
  .row.head{display:none}
  .cat{grid-template-columns:minmax(0,7.5rem) minmax(0,1fr) auto;padding:7px 10px}
  .form{grid-template-columns:1fr}
  .lesson-f{grid-template-columns:1fr}
}
@media (min-width:821px){ .r-pay label.mini span{display:none} }


/* Doplňky pro evidenci projektů */
.dialog.wide{max-width:980px}
.r-list{grid-template-columns:6.5rem minmax(0,2fr) minmax(0,1.3fr) 4.5rem 5rem 7rem 8.5rem}
.r-proj{grid-template-columns:minmax(0,2.4fr) minmax(0,1.4fr) 9rem 6rem 8rem}
.r-emp{grid-template-columns:minmax(0,1.6fr) minmax(0,1fr) 6rem 6.5rem 9rem 8rem}
.r-cli{grid-template-columns:minmax(0,1.6fr) minmax(0,1fr) 7rem 5rem 6rem 8rem}
.r-chk{grid-template-columns:7rem minmax(0,1fr) auto}
.r-part{grid-template-columns:minmax(0,2fr) 8rem 7.5rem 5.5rem 5.5rem 6.5rem 2.6rem}
.r-team{grid-template-columns:minmax(0,2fr) 8rem 7rem 7rem 2.6rem}
.r-phase{grid-template-columns:8rem 1fr 1fr 6rem}
.part-k{border-left:4px solid var(--mango)} .part-z{border-left:4px solid var(--btn)}
.typy{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:6px 14px;border:1.5px solid var(--line);border-radius:var(--r);padding:10px 12px}
.typy label{display:flex;gap:8px;align-items:flex-start;font-weight:500;color:var(--ink);font-size:.9rem}
.sec{grid-column:1/-1;margin:10px 0 -2px;font-size:.78rem;text-transform:uppercase;letter-spacing:.08em;color:var(--brand-ink);font-weight:700;border-bottom:1px solid var(--line);padding-bottom:4px}
.issues{display:grid;gap:6px;margin:12px 0 0}
.issue{display:flex;gap:8px;align-items:flex-start;padding:7px 10px;border-radius:var(--r);font-size:.88rem}
.issue.err{background:var(--bad-bg);color:var(--bad)} .issue.warn{background:var(--warn-bg);color:var(--warn)} .issue.info{background:var(--idle-bg);color:var(--muted)}
.issue b{flex:none}
.issue a{color:inherit;font-weight:700}
.pcards{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:12px}
.pcard{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;display:grid;gap:10px;border-top:4px solid var(--brand)}
.pcard h3{margin:0;font-size:1.02rem}
.pcard .code{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:.8rem;color:var(--muted)}
.meter{display:grid;gap:4px}
.meter .track{height:12px;position:relative}
.meter .mk{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--ink);opacity:.55}
.meter .cap-line span:last-child{color:var(--muted)}
.fill.ok{background:var(--good)}
.scan{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.scan img{max-height:120px;border:1px solid var(--line);border-radius:4px;cursor:zoom-in}
.picker{position:relative}
.picker .opts{position:absolute;left:0;right:0;top:100%;z-index:5;background:var(--surface);border:1.5px solid var(--line);border-radius:var(--r);max-height:260px;overflow:auto;box-shadow:0 8px 24px rgba(0,0,0,.12);display:none}
.picker .opts.open{display:block}
.picker .opt{padding:8px 11px;cursor:pointer;display:flex;justify-content:space-between;gap:10px}
.picker .opt:hover,.picker .opt.act{background:var(--soft)}
.picker .opt small{color:var(--muted)}
.sumline{display:flex;gap:18px;flex-wrap:wrap;font-size:.9rem;padding:10px 12px;background:var(--soft);border-radius:var(--r);margin-top:10px}
.sumline b{font-variant-numeric:tabular-nums}
.x{border:0;background:none;cursor:pointer;color:var(--muted);font-size:1.2rem;line-height:1;padding:4px}
.x:hover{color:var(--bad)}

<body>
<header><div class="head-in">
  <div class="top">

    <div class="title"><h1>Evidence projektů</h1><p>SEA-l · projekty, prezenční listiny, výkazy, zaměstnanci a klienti</p></div>
    <button class="sync" id="syncBadge" title="Stav ukládání" onclick="location.hash='nastaveni'"><i></i><span id="syncText">Načítám…</span></button>
  </div>
  <nav aria-label="Hlavní">
    <a href="#prehled" data-v="prehled">Přehled</a>
    <a href="#listiny" data-v="listiny">Prezenční listiny</a>
    <a href="#vykazy" data-v="vykazy">Výkazy</a>
    <a href="#projekty" data-v="projekty">Projekty</a>
    <a href="#zamestnanci" data-v="zamestnanci">Zaměstnanci</a>
    <a href="#klienti" data-v="klienti">Klienti</a>
    <a href="#kontroly" data-v="kontroly">Kontroly<span id="navErr"></span></a>
    <a href="#nastaveni" data-v="nastaveni">Nastavení</a>
  </nav>
</div></header>
<main class="wrap" id="main"></main>
<div class="overlay" id="overlay"><div class="dialog" id="dialog" role="dialog" aria-modal="true"></div></div>
<div class="lightbox" id="lightbox"><img id="lbImg" alt=""></div>
<div class="toast" id="toast" role="status"></div>
<script>
"use strict";
/* ============ Evidence projektů SEA-l ============ */
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => Array.from(r.querySelectorAll(s));
const esc = v => String(v ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
const clone = o => JSON.parse(JSON.stringify(o));
const COLLS = ["projekty", "zamestnanci", "klienti", "listiny", "aktivity", "vykazy", "nastaveni"];
const LS_KEY = "evidence-projektu-v1";

const DEFAULT_TYPY = [
  "Tlumočení / Phiên dịch",
  "Interkulturní asistence (doprovody) / Trợ lý Giao văn hoá /đi theo/",
  "Interkulturní mediace / Hoà giải Giao văn hoá",
  "Odborné konzultace a supervize / Tư vấn chuyên nghiệp và cố vấn",
  "Orientační vyšetření / Trắc nghiệm định hướng",
  "Interaktivní nácvik / Thực tập tương tác",
  "Skupinové sdílení - terapie / chia sẻ trong nhóm - trị liệu",
  "Aktivizační aktivita"
];
const ROLE_K = ["rodič", "dítě"];
const ROLE_Z = ["mentor", "rt"];
const SMLOUVY = ["HPP", "DPP", "DPČ", "OSVČ / faktura", "jiná"];
const FAZE = [["priprava", "Příprava"], ["realizace", "Realizace"], ["zhodnoceni", "Zhodnocení"]];
// Výchozí pravidla – dají se změnit v Nastavení
const RULE_DEF = { dppRok: 300, dpcTyden: 20, maxDen: 12, maxTyden: 48, hppTyden: 40, vikend: "warn", svatek: "warn", nocni: "off", nocOd: "22:00", nocDo: "06:00", volno: [] };
const rules = () => Object.assign({}, RULE_DEF, S.nastaveni.find(x => x.id === "pravidla") || {});
const LVL_OPTS = [["err", "chyba"], ["warn", "upozornění"], ["off", "povoleno"]];
const AKT_KAT = ["Příprava", "Administrativa a dokumentace", "Porada / supervize", "Konzultace", "Cesta", "Jiné"];
const DOK_TYP = ["Smlouva", "Dohoda (DPP/DPČ)", "Projektová dokumentace", "Rozhodnutí / právní akt", "Jiné"];

let S = { projekty: [], zamestnanci: [], klienti: [], listiny: [], aktivity: [], vykazy: [], nastaveni: [] };
let mode = "local";             // local | db
let DB = null, ASSETS = null, DL = null;
let view = "prehled";
const UI = { listProj: "", listMonth: "", listQ: "", chk: "all", empQ: "", cliQ: "", vZam: "", vProj: "", vMon: new Date().toISOString().slice(0, 7), selZ: "", selP: "" };

/* ---------- formát ---------- */
const nf = new Intl.NumberFormat("cs-CZ", { maximumFractionDigits: 1 });
const kc = n => new Intl.NumberFormat("cs-CZ", { maximumFractionDigits: 0 }).format(Math.round(n || 0)) + " Kč";
const h = n => nf.format(Math.round((n || 0) * 10) / 10) + " h";
const today = () => new Date().toISOString().slice(0, 10);
const fmtD = d => { if (!d) return ""; const [y, m, dd] = d.split("-"); return `${+dd}. ${+m}. ${y}`; };
const fmtMin = m => { m = Math.max(0, Math.round(m || 0)); return `${Math.floor(m / 60)}:${String(m % 60).padStart(2, "0")}`; };
const toMin = t => { if (!t || !/^\d{1,2}:\d{2}$/.test(t)) return null; const [a, b] = t.split(":").map(Number); return a * 60 + b; };
const pl = (n, a, b, c) => `${n} ${n === 1 ? a : n >= 2 && n <= 4 ? b : c}`;
const norm = s => String(s || "").normalize("NFD").replace(/[̀-ͯ]/g, "").toLowerCase().trim();
const num = v => { const n = parseFloat(String(v ?? "").replace(",", ".").replace(/\s/g, "")); return isFinite(n) ? n : null; };

/* ---------- přístup k datům ---------- */
const proj = id => S.projekty.find(x => x.id === id);
const zam = id => S.zamestnanci.find(x => x.id === id);
const kli = id => S.klienti.find(x => x.id === id);
const lis = id => S.listiny.find(x => x.id === id);
const akt = id => S.aktivity.find(x => x.id === id);
const parentOf = p => p && p.parentId ? proj(p.parentId) : null;
const childrenOf = pid => S.projekty.filter(p => p.parentId === pid);
const projSet = pid => [pid, ...childrenOf(pid).map(p => p.id)];
const eff = (p, k) => p ? (p[k] || (parentOf(p) || {})[k] || "") : "";   // hodnota, nebo zděděná z nadřazeného projektu
const projTree = () => { const top = S.projekty.filter(p => !p.parentId || !proj(p.parentId)).sort((a, b) => projLabel(a).localeCompare(projLabel(b), "cs")); const out = []; for (const p of top) { out.push([p, 0]); for (const c of childrenOf(p.id).sort((a, b) => projLabel(a).localeCompare(projLabel(b), "cs"))) out.push([c, 1]); } return out; };
const fullName = o => o ? `${o.prijmeni || ""} ${o.jmeno || ""}`.trim() || "(bez jména)" : "(smazáno)";
const person = p => p.typ === "z" ? zam(p.refId) : kli(p.refId);
const projLabel = p => p ? ([p.interniKod, p.zkratka || p.nazev].filter(Boolean).join(" · ") || "(bez názvu)") : "(bez projektu)";
const sortByName = (a, b) => fullName(a).localeCompare(fullName(b), "cs");
const typyOf = p => (p && p.typy && p.typy.length) ? p.typy : DEFAULT_TYPY;

function age(dob, at) {
  if (!dob) return null;
  const a = new Date(dob), b = new Date(at || today());
  let y = b.getFullYear() - a.getFullYear();
  if (b.getMonth() < a.getMonth() || (b.getMonth() === a.getMonth() && b.getDate() < a.getDate())) y--;
  return y;
}

/* ---------- výpočty ---------- */
// Časové bloky listiny: casy = [{id, typ: priprava|realizace|zhodnoceni, od, do}]. Starší data měla faze{}.
const FAZE_N = { priprava: "Příprava", realizace: "Realizace", zhodnoceni: "Zhodnocení" };
const FAZE_VI = { priprava: "Chuẩn bị", realizace: "Triển khai", zhodnoceni: "Đánh giá" };
function casyOf(l) {
  if (Array.isArray(l.casy)) return l.casy;
  const out = []; for (const [k] of FAZE) { const f = (l.faze || {})[k]; if (f && (f.od || f.do)) out.push({ id: k, typ: k, od: f.od || "", do: f.do || "" }); }
  return out;
}
const blkMin = b => { const a = toMin(b && b.od), e = toMin(b && b.do); return a != null && e != null && e > a ? e - a : 0; };
const blkInts = (B, onlyReal) => B.filter(b => !onlyReal || b.typ === "realizace").map(b => [toMin(b.od), toMin(b.do)]).filter(([a, e]) => a != null && e != null && e > a);
const partCasy = (l, p) => Array.isArray(p.casy) ? p.casy : casyOf(l);   // vlastní časy účastníka, jinak časy listiny
const listMin = l => casyOf(l).reduce((s, b) => s + blkMin(b), 0);
const partMin = (l, p) => partCasy(l, p).reduce((s, b) => s + blkMin(b), 0);
function partHours(l, p) { const v = num(p.hodiny); return v != null ? v : partMin(l, p) / 60; }
const phaseInts = (l, onlyReal) => blkInts(casyOf(l), onlyReal);
const partInts = (l, p, onlyReal) => blkInts(partCasy(l, p), onlyReal);
const casyText = B => B.filter(b => b.od || b.do).map(b => `${b.od}–${b.do} ${FAZE_N[b.typ] || ""}`.trim()).join("; ");
function checkBlocks(B, add, pre, who) {
  B.forEach((b, i) => {
    if (!b.od && !b.do) return;
    const a = toMin(b.od), e = toMin(b.do), n = `${pre}čas ${i + 1} (${FAZE_N[b.typ] || "bez aktivity"})`;
    if (!b.od || !b.do) add("err", `${n}: vyplň od i do.`, who);
    else if (a == null || e == null) add("err", `${n}: čas musí být ve tvaru HH:MM.`, who);
    else if (e <= a) add("err", `${n}: „do“ musí být později než „od“.`, who);
    if (!FAZE_N[b.typ]) add("err", `${n}: vyber, o jakou aktivitu jde.`, who);
  });
  const I = B.map((b, i) => [i, toMin(b.od), toMin(b.do)]).filter(x => x[1] != null && x[2] != null && x[2] > x[1]);
  for (let i = 0; i < I.length; i++) for (let j = i + 1; j < I.length; j++) if (I[i][1] < I[j][2] && I[j][1] < I[i][2]) add("warn", `${pre}časy ${I[i][0] + 1} a ${I[j][0] + 1} se překrývají.`, who);
}
/* ---------- typ dne (pracovní / víkend / svátek) – automaticky, s možností ručně změnit ---------- */
const DEN_N = { pracovni: "pracovní den", vikend: "víkend", svatek: "svátek" };
function denAuto(d) { const di = dayInfo(d); return di.svatek || di.volno ? "svatek" : di.vikend ? "vikend" : "pracovni"; }
const denOf = x => (x && DEN_N[x.denTyp]) ? x.denTyp : denAuto(x && x.datum);
function denAutoText(d) { if (!d) return ""; const di = dayInfo(d); return di.svatek ? `svátek – ${di.svatek}` : di.volno ? `naše volno – ${di.volno}` : di.vikend ? "víkend" : "pracovní den"; }
function teamRow(pr, zid) { if (!pr) return null; return (pr.tym || []).find(t => t.zid === zid) || ((parentOf(pr) || {}).tym || []).find(t => t.zid === zid) || null; }

/* ---------- smlouvy ---------- */
const contracts = z => (z && z.smlouvy) || [];
const cLabel = c => c ? (c.cislo && c.typ && norm(c.cislo).startsWith(norm(c.typ)) ? c.cislo : [c.typ, c.cislo].filter(Boolean).join(" ")) || "smlouva" : "";
function cApplies(c, pid) { const P = c.projekty || []; if (!P.length) return true; const p = proj(pid); return P.includes(pid) || (p && P.includes(p.parentId)); }
const cValid = (c, d) => !d || ((!c.od || d >= c.od) && (!c.do || d <= c.do));
function resolveContract(zid, pid, datum, explicitId) {
  const all = contracts(zam(zid));
  if (explicitId) { const c = all.find(x => x.id === explicitId); if (c) return { c, multi: false, explicit: true }; }
  const cand = all.filter(c => cValid(c, datum) && cApplies(c, pid)).sort((a, b) => ((b.projekty || []).length ? 1 : 0) - ((a.projekty || []).length ? 1 : 0));
  return { c: cand[0] || null, multi: cand.length > 1, explicit: false };
}
const rateC = c => num(c && c.sazba) || 0;
// sazba za hodinu podle smlouvy včetně příplatku za víkend / svátek
function rateDay(c, den) { const pct = den === "svatek" ? num(c && c.priplSvatek) : den === "vikend" ? num(c && c.priplVikend) : 0; return rateC(c) * (1 + (pct || 0) / 100); }
function rateOf(l, p) { return rateDay(resolveContract(p.refId, l.projektId, l.datum, p.smlouvaId).c, denOf(l)); }

/* ---------- pracovní kalendář: víkendy, státní svátky ČR, vlastní volno ---------- */
function easterSunday(y) { const a = y % 19, b = Math.floor(y / 100), c = y % 100, d = Math.floor(b / 4), e = b % 4, f = Math.floor((b + 8) / 25), g = Math.floor((b - f + 1) / 3), h2 = (19 * a + b - d - g + 15) % 30, i = Math.floor(c / 4), k = c % 4, l = (32 + 2 * e + 2 * i - h2 - k) % 7, m = Math.floor((a + 11 * h2 + 22 * l) / 451), mo = Math.floor((h2 + l - 7 * m + 114) / 31), da = ((h2 + l - 7 * m + 114) % 31) + 1; return new Date(Date.UTC(y, mo - 1, da)); }
const HOLS = {};
function holidays(y) {
  if (HOLS[y]) return HOLS[y];
  const o = {}, f = (m, d, n) => o[`${y}-${String(m).padStart(2, "0")}-${String(d).padStart(2, "0")}`] = n;
  f(1, 1, "Den obnovy samostatného českého státu, Nový rok"); f(5, 1, "Svátek práce"); f(5, 8, "Den vítězství"); f(7, 5, "Den slovanských věrozvěstů Cyrila a Metoděje");
  f(7, 6, "Den upálení mistra Jana Husa"); f(9, 28, "Den české státnosti"); f(10, 28, "Den vzniku samostatného československého státu"); f(11, 17, "Den boje za svobodu a demokracii");
  f(12, 24, "Štědrý den"); f(12, 25, "1. svátek vánoční"); f(12, 26, "2. svátek vánoční");
  const es = easterSunday(y), add = (n, name) => { const d = new Date(es.getTime() + n * 864e5); o[d.toISOString().slice(0, 10)] = name; };
  add(-2, "Velký pátek"); add(1, "Velikonoční pondělí");
  return HOLS[y] = o;
}
function dayInfo(d) {
  if (!d) return {};
  const wd = new Date(d + "T12:00:00Z").getUTCDay(), v = (rules().volno || []).find(x => x.datum === d);
  return { vikend: wd === 0 || wd === 6, svatek: holidays(+d.slice(0, 4))[d] || null, volno: v ? (v.nazev || "volno") : null };
}
function calIssues(d, ints, add, who, denTyp) {
  const r = rules(), di = dayInfo(d);
  if (DEN_N[denTyp]) {
    if (denTyp !== denAuto(d)) add("info", `Typ dne ručně změněn na „${DEN_N[denTyp]}“ (automaticky: ${denAutoText(d)}).`, who);
    di.svatek = di.volno = null; di.vikend = false;
  }
  if (di.svatek && r.svatek !== "off") add(r.svatek, `${fmtD(d)} je státní svátek (${di.svatek}).`, who);
  if (di.volno && r.svatek !== "off") add(r.svatek, `${fmtD(d)} je u nás nepracovní den (${di.volno}).`, who);
  if (di.vikend && r.vikend !== "off") add(r.vikend, `${fmtD(d)} je víkend.`, who);

    else if (x.st === "rozdil") push("err", `Výkaz ${m} (${pn}): vyplaceno ${kc(x.paid)}, podle výkazu ${kc(x.comp)} – ${x.rozdil > 0 ? "přeplatek" : "nedoplatek"} ${kc(Math.abs(x.rozdil))}.`, "vyk", v.id, lab);

function nextNo(coll, rec) {
  if (coll === "listiny") {
    const y = (rec.datum || today()).slice(0, 4), pre = `PL-${y}-`;
    const max = S.listiny.reduce((m, l) => l.cislo && l.cislo.startsWith(pre) ? Math.max(m, parseInt(l.cislo.slice(pre.length)) || 0) : m, 0);
    return pre + String(max + 1).padStart(4, "0");
  }
  const max = S.klienti.reduce((m, k) => k.cislo && /^K-\d+$/.test(k.cislo) ? Math.max(m, parseInt(k.cislo.slice(2))) : m, 0);

}

let numbering = false;
async function ensureNumbers() {

    for (const k of [...S.klienti].filter(k => !k.cislo).sort((a, b) => (a.vytvoreno || a.upraveno || "").localeCompare(b.vytvoreno || b.upraveno || ""))) await save("klienti", { ...k });
    for (const l of [...S.listiny].filter(l => !l.cislo).sort((a, b) => (a.datum || "").localeCompare(b.datum || ""))) await save("listiny", { ...l });

}
async function save(coll, rec) {
  rec.upraveno = new Date().toISOString();
  if (!rec.vytvoreno) rec.vytvoreno = rec.upraveno;
  if ((coll === "listiny" || coll === "klienti") && !rec.cislo) rec.cislo = nextNo(coll, rec);
  const i = S[coll].findIndex(x => x.id === rec.id);
  if (i >= 0) S[coll][i] = rec; else S[coll].push(rec);
  renderAll();
  if (mode === "gh") ghQueue({ t: "set", c: coll, rec: clone(rec) });
  else if (mode === "db") {
    paintSync("busy", "Ukládám…");
    try { await DB.collection(coll).doc(rec.id).set(clone(rec)); syncIdle(); }
    catch (e) { paintSync("err", "Neuloženo"); toast(e && e.code === "quota_exceeded" ? "Úložiště je plné, záznam se neuložil." : "Záznam se nepodařilo uložit. Zkus to znovu."); }
  } else saveLocal();
}
async function remove(coll, id) {
  S[coll] = S[coll].filter(x => x.id !== id);
  renderAll();
  if (mode === "gh") ghQueue({ t: "del", c: coll, id });
  else if (mode === "db") { try { await DB.collection(coll).doc(id).delete(); } catch (e) { toast("Smazání se nepodařilo."); } }
  else saveLocal();
}
async function replaceAll(data) {
  const old = clone(S);
  for (const c of COLLS) S[c] = Array.isArray(data[c]) ? data[c] : [];
  renderAll();
  if (mode === "gh") { ghQueue({ t: "all", data: clone(S) }); migrate().then(ensureNumbers); return; }
  if (mode !== "db") { saveLocal(); migrate().then(ensureNumbers); return; }
  paintSync("busy", "Ukládám…");
  try {
    for (const c of COLLS) {
      const keep = new Set(S[c].map(x => x.id));
      for (const x of old[c]) if (!keep.has(x.id)) await DB.collection(c).doc(x.id).delete();
      for (const x of S[c]) await DB.collection(c).doc(x.id).set(clone(x));
    }
    syncIdle(); migrate().then(ensureNumbers);
  } catch (e) { paintSync("err", "Neuloženo"); toast("Část dat se nepodařilo uložit."); }
}
async function connectDb() {
  if (!window.claude || typeof window.claude.use !== "function") { syncIdle(); return; }
  try { [DB, ASSETS, DL] = await Promise.all(["db", "assets", "downloads"].map(n => window.claude.use(n).catch(() => null))); } catch (e) { }
  if (!DB) { syncIdle(); renderAll(); return; }
  paintSync("busy", "Načítám…");
  const got = {};
  const timer = setTimeout(() => { if (mode !== "db") paintSync("err", "Úložiště neodpovídá"); }, 10000);
  for (const c of COLLS) {
    DB.collection(c).onSnapshot(snap => {
      S[c] = snap.docs.map(d => ({ ...clone(d.data()), id: d.id }));
      got[c] = true;
      if (COLLS.every(x => got[x])) {
        if (mode !== "db") { mode = "db"; clearTimeout(timer); try { localStorage.removeItem(LS_KEY); } catch (e) { } }
        syncIdle(); renderKeep(); migrate().then(ensureNumbers);
      }
    }, err => { clearTimeout(timer); paintSync("err", "Úložiště nedostupné"); });
  }
}

async function offerFile(name, data, mime) {
  if (DL) {
    try { await DL.save({ filename: name, data }); return true; }
    catch (e) { if (e && e.code === "declined") return false; }
  }
  try {
    const a = document.createElement("a");
    a.href = URL.createObjectURL(new Blob([data], { type: mime || "application/octet-stream" }));
    a.download = name; document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 4000);
    return true;
  } catch (e) { toast("Stažení tady nejde."); return false; }
}
function printDoc(html, name) {
  // Na GitHub Pages rovnou otevře tisk; v náhledu Claude nabídne stažení souboru, který se po otevření sám vytiskne.
  if (!window.claude) {
    const f = document.createElement("iframe");
    f.style.cssText = "position:fixed;width:0;height:0;border:0;right:0;bottom:0";
    document.body.appendChild(f);
    f.srcdoc = html;
    f.onload = () => { try { f.contentWindow.focus(); f.contentWindow.print(); } catch (e) { offerFile(name, html, "text/html"); } setTimeout(() => f.remove(), 60000); };
    return;
  }
  offerFile(name, html.replace("</body>", "<script>window.onload=()=>setTimeout(()=>print(),300)<\/script></body>"), "text/html")
    .then(ok => ok && toast("Otevři stažený soubor, tisk se spustí sám."));
}

function openDlg(html, wide, focusSel) {

const opt = (v, l, sel) => `<option value="${esc(v)}"${sel ? " selected" : ""}>${esc(l)}</option>`;
function meter(label, cur, min, max, fmt) {
  if (min == null && max == null) return `<div class="meter"><div class="cap-line"><span>${label}</span><b>${fmt(cur)}</b></div><div class="sub">Podmínka není zadaná.</div></div>`;
  const top = max != null ? max : min * 1.25 || 1;
  const pct = Math.min(100, cur / top * 100), mk = min != null && max != null ? min / max * 100 : null;
  const cls = max != null && cur > max ? "over" : min != null && cur < min ? "" : "ok";
  return `<div class="meter"><div class="cap-line"><span>${label}: <b>${fmt(cur)}</b></span><span>${min != null ? "min " + fmt(min) : ""}${min != null && max != null ? " · " : ""}${max != null ? "max " + fmt(max) : ""}</span></div>
  <div class="track"><div class="fill ${cls}" style="width:${pct}%"></div>${mk != null ? `<i class="mk" style="left:${mk}%"></i>` : ""}</div></div>`;
}

  const free = () => S.zamestnanci.filter(z => !P.tym.some(t => t.zid === z.id)).sort(sortByName);

  <label class="full">Název projektu (oficiální, tiskne se na listinu)<input type="text" id="p_nazev" value="${esc(P.nazev || "")}" ${ph("nazev")}></label>

  <label>Příjemce / partner<input type="text" id="p_prijemce" value="${esc(P.prijemce || "")}" ${ph("prijemce")}></label>

  <label>Realizace od<input type="date" id="p_od" value="${esc(P.od || "")}"></label>
  <label>Realizace do<input type="date" id="p_do" value="${esc(P.do || "")}"></label>
  <label>Stav<select id="p_stav">${opt("aktivni", "Aktivní", P.stav !== "ukonceny")}${opt("ukonceny", "Ukončený", P.stav === "ukonceny")}</select></label>
  ${par ? `<p class="hint full" style="margin-top:-4px">Prázdná pole (reg. číslo, název, příjemce, období) se přeberou z projektu ${esc(projLabel(par))}.</p>` : ""}
  ${id && !par ? `<div class="sec">Podprojekty</div><div class="full">${kids.length ? `<div class="sheet">${kids.map(k => { const st = projStats(k.id); return `<div class="row click r-proj" data-act="editProj" data-id="${k.id}"><span class="name">${esc(projLabel(k))}</span><span class="sub c-code">${esc(k.kod || "")}</span><span class="num c-date">${fmtD(k.od)}<br>${fmtD(k.do)}</span><span class="num c-n">${st.n}</span><span class="num">${h(st.hours)}</span></div>`; }).join("")}</div>` : `<div class="empty">Bez podprojektů.</div>`}<button type="button" class="btn small" id="p_kid" style="margin-top:8px">+ Podprojekt</button></div>` : ""}

  <p class="hint full" style="margin-top:-4px">Čas = hodiny pracovníků z listin a doplněné práce${kids.length ? " včetně podprojektů" : ""}. Finance = hodiny × sazba ze smlouvy pracovníka.</p>
  <div class="sec">Tým projektu</div>

  <div class="bar" style="margin:8px 0 0"><select class="grow" id="p_add"></select><button type="button" class="btn small" id="p_addBtn">Přidat do týmu</button></div></div>
  <div class="sec">Smlouvy, dohody a projektová dokumentace</div>
  <div class="full"><div class="sheet" id="p_doks"></div><div id="p_dokForm"></div><button type="button" class="btn small" id="p_dokAdd" style="margin-top:8px">+ Dokument</button></div>
  <div class="sec">Hlavička prezenční listiny</div>
  <label>Nadpis<input type="text" id="p_nadpis" value="${esc(P.nadpis || "")}"></label>
  <label>Nadpis vietnamsky<input type="text" id="p_nadpisVi" value="${esc(P.nadpisVi || "")}"></label>
  <label>Označení (vpravo nahoře)<input type="text" id="p_oznaceni" value="${esc(P.oznaceni || "")}"></label>
  <label class="full">Typy intervence (jeden na řádek, pořadí = číslo na listině)<textarea id="p_typy" rows="8">${esc(typyOf(P).join("\n"))}</textarea></label>
  <label class="full">Poznámka<textarea id="p_pozn" rows="2">${esc(P.pozn || "")}</textarea></label>
  </form><p class="err" id="p_err"></p>
  <div class="actions">${id ? `<button class="btn danger left" id="p_del">Smazat</button>` : ""}<button class="btn" id="p_print">Prázdná listina k tisku</button><button class="btn" id="p_cancel">Zrušit</button><button class="btn primary" id="p_save">Uložit</button></div>`, true, "#p_nazev");
  const paintTeam = () => {
    $("#p_team").innerHTML = teamRows();
    const f = free(); $("#p_add").innerHTML = f.length ? f.map(z => opt(z.id, fullName(z) + (z.pozice ? " – " + z.pozice : ""))).join("") : opt("", S.zamestnanci.length ? "Všichni už jsou v týmu" : "Nejdřív přidej zaměstnance");
    $("#p_addBtn").disabled = !f.length;
  };
  const paintDoks = () => { $("#p_doks").innerHTML = dokRows(); };
  paintTeam(); paintDoks();
  $("#p_team").addEventListener("change", e => { const t = e.target.dataset.t, i = +e.target.dataset.i; if (t === "role") P.tym[i].role = e.target.value; });
  $("#p_team").addEventListener("click", e => { if (e.target.dataset.t === "del") { P.tym.splice(+e.target.dataset.i, 1); paintTeam(); } if (e.target.dataset.zam) { const zid = e.target.dataset.zam; $("#p_save").click(); if (!$("#overlay").classList.contains("open")) zamDlg(zid); } });
  $("#p_addBtn").onclick = () => { const v = $("#p_add").value; if (v) { P.tym.push({ zid: v, role: "mentor" }); paintTeam(); } };
  $("#p_doks").addEventListener("click", e => { if (e.target.dataset.d === "del") { P.dokumenty.splice(+e.target.dataset.i, 1); paintDoks(); } });
  $("#p_dokAdd").onclick = () => {
    const box = $("#p_dokForm"); let file = null;
    box.innerHTML = `<div class="panel" style="margin-top:8px"><div class="form">
      <label>Typ<select id="d_typ">${DOK_TYP.map(t => opt(t, t)).join("")}</select></label>
      <label>Název<input type="text" id="d_nazev" placeholder="např. Dohoda o provedení práce"></label>
      <label>Číslo / označení<input type="text" id="d_cislo"></label>
      <label>Pracovník (nepovinné)<select id="d_zid">${opt("", "—")}${P.tym.map(t => opt(t.zid, fullName(zam(t.zid)))).join("")}</select></label>
      <label>Ze dne<input type="date" id="d_datum"></label><label>Platí do<input type="date" id="d_do"></label>
      <label class="full">Poznámka<input type="text" id="d_pozn"></label>
      ${mode === "gh" ? `<label class="full">Kde je dokument uložený (odkaz, složka)<input type="text" id="d_link"></label>` : `<label class="full">Soubor (nepovinné)<input type="file" id="d_file"></label>`}</div>
      <p class="err" id="d_err"></p><div class="actions" style="margin-top:4px"><button type="button" class="btn small" id="d_x">Zrušit</button><button type="button" class="btn small primary" id="d_ok">Přidat dokument</button></div></div>`;
    $("#d_nazev").focus();
    if ($("#d_file")) $("#d_file").onchange = e => { file = e.target.files[0] || null; };
    $("#d_x").onclick = () => box.innerHTML = "";
    $("#d_ok").onclick = async () => {
      const d = { id: uid(), typ: val("d_typ"), nazev: val("d_nazev"), cislo: val("d_cislo"), zid: val("d_zid"), datum: val("d_datum"), platnostDo: val("d_do"), pozn: val("d_pozn") };
      if (!d.nazev) { $("#d_err").textContent = "Vyplň název dokumentu."; return; }
      if ($("#d_link") && val("d_link")) d.soubor = { name: "odkaz", link: val("d_link") };
      if (file) {
        if (ASSETS) { $("#d_ok").disabled = true; $("#d_ok").textContent = "Nahrávám…"; try { const r = await ASSETS.upload(file); d.soubor = { id: r.id, url: r.url, name: file.name, type: file.type }; } catch (e) { $("#d_err").textContent = "Soubor se nepodařilo nahrát."; $("#d_ok").disabled = false; $("#d_ok").textContent = "Přidat dokument"; return; } }
        else if (file.size <= 1.5 * 1024 * 1024) d.soubor = await new Promise(res => { const r = new FileReader(); r.onload = () => res({ data: r.result, name: file.name, type: file.type }); r.readAsDataURL(file); });
        else { $("#d_err").textContent = "Bez sdíleného úložiště jde uložit jen soubor do 1,5 MB. Ulož dokument bez souboru."; return; }
      }
      P.dokumenty.push(d); box.innerHTML = ""; paintDoks();
    };
  };
  const collect = () => Object.assign(P, {
    parentId: kids.length ? "" : val("p_parent"), nazev: val("p_nazev"), kod: val("p_kod"), interniKod: val("p_ikod"), zkratka: val("p_zkratka"), prijemce: val("p_prijemce"), stav: val("p_stav"), od: val("p_od"), do: val("p_do"),
    hodMin: num(val("p_hmin")), hodMax: num(val("p_hmax")), finMin: num(val("p_fmin")), finMax: num(val("p_fmax")),
    nadpis: val("p_nadpis"), nadpisVi: val("p_nadpisVi"), oznaceni: val("p_oznaceni"),
    typy: $("#p_typy").value.split("\n").map(s => s.trim()).filter(Boolean), pozn: val("p_pozn")
  });
  $("#p_print").onclick = () => { collect(); printDoc(listinaHtml(P, null), `Prezencni_listina_${(eff(P, "kod") || "projekt").replace(/[^\w.-]+/g, "_")}.html`); };

    if (!P.nazev && !P.zkratka && !P.interniKod) return err("Vyplň název nebo interní název.");
    if (!P.nazev && !P.parentId) return err("Vyplň název projektu.");
    if (P.od && P.do && P.do < P.od) return err("Konec realizace je před začátkem.");
    if (P.hodMin != null && P.hodMax != null && P.hodMin > P.hodMax) return err("Minimum času je větší než maximum.");
    if (P.finMin != null && P.finMax != null && P.finMin > P.finMax) return err("Minimum financí je větší než maximum.");

  };

}

/* ---------- DIALOGY: zaměstnanec ---------- */
function zamDlg(id) {
  const Z = id ? clone(zam(id)) : { aktivni: true, smlouvy: [] };
  if (!Z) return;
  Z.smlouvy = Z.smlouvy || [];
  const y = today().slice(0, 4);
  const W0 = id ? workOf(id) : [];
  let stats = "";
  if (id) {
    const W = W0.slice().reverse();
    const byP = {};
    for (const w of W) { const k = w.projektId || ""; byP[k] = byP[k] || { h: 0, c: 0, n: 0, a: 0 }; byP[k].h += w.hodiny; byP[k].c += w.hodiny * w.rate; w.src === "pl" ? byP[k].n++ : byP[k].a++; }
    const RL = rules(), dppH = sumH(W0.filter(w => w.smlouva && w.smlouva.typ === "DPP" && (w.datum || "").startsWith(y)));
    stats = `<div class="sec">Co dělal/a</div><div class="full">
    ${Z.smlouvy.some(c => c.typ === "DPP") ? meter(`Všechny DPP v roce ${y}`, dppH, null, RL.dppRok, h) : `<div class="sub">Rok ${y}: <b>${h(empHours(id, w => (w.datum || "").startsWith(y)))}</b></div>`}
    ${Object.keys(byP).length ? `<table class="grid" style="margin-top:10px"><thead><tr><th>Projekt</th><th class="r">Listin</th><th class="r">Doplněno</th><th class="r">Hodin</th><th class="r">Odměna</th></tr></thead><tbody>${Object.entries(byP).map(([pid, v]) => `<tr><td>${esc(projLabel(proj(pid)))}</td><td class="r">${v.n}</td><td class="r">${v.a}</td><td class="r">${h(v.h)}</td><td class="r">${kc(v.c)}</td></tr>`).join("")}</tbody></table>` : ""}
    <div class="sheet" style="margin-top:10px;max-height:280px;overflow:auto">${W.length ? W.map(w => `<div class="row click r-chk" data-act="${w.src === "pl" ? "editList" : "editAkt"}" data-id="${w.id}"><span class="num">${fmtD(w.datum)}<br><span class="mono">${esc(w.src === "pl" ? w.cislo : "doplněno")}</span></span><span><span class="name">${esc(w.text || w.kat || "")}</span> <span class="sub">· ${esc(projLabel(proj(w.projektId)))} · ${esc(cLabel(w.smlouva) || "bez smlouvy")} · ${w.src === "pl" ? esc(w.role || "") + " · " + esc(typyNames(w.ref)) : esc(w.kat || "")}</span></span><span class="num">${h(w.hodiny)}</span></div>`).join("") : `<div class="empty">Zatím žádná práce.</div>`}</div>
    <div class="chips" style="margin-top:8px"><button type="button" class="btn small" data-act="newAkt" data-z="${id}">+ Doplnit práci mimo listiny</button><button type="button" class="btn small" data-act="toVyk" data-z="${id}">Pracovní výkazy</button></div></div>`;
  }
  const cf = (i, k, label, type, extra) => `<label>${label}<input type="${type || "text"}" data-c="${k}" data-i="${i}" value="${esc(Z.smlouvy[i][k] ?? "")}" ${extra || ""}></label>`;
  const cRows = () => Z.smlouvy.length ? Z.smlouvy.map((c, i) => {
    const CW = W0.filter(w => w.smlouva && w.smlouva.id === c.id);
    const act = cValid(c, today());
    return `<div class="panel tpanel"><div class="tp-h"><span class="name">${esc(cLabel(c))}</span><span class="sub">${act ? "platí" : "neplatí"}${CW.length ? ` · zatím ${h(sumH(CW))}, ${kc(sumC(CW))}` : ""}</span><button type="button" class="x" data-c="del" data-i="${i}" title="Odebrat smlouvu">✕</button></div>
    <div class="tgrid">
      <label>Typ<select data-c="typ" data-i="${i}">${SMLOUVY.map(s => opt(s, s, c.typ === s)).join("")}</select></label>
      ${cf(i, "cislo", "Číslo smlouvy", "text", 'placeholder="např. DPP 03/2026"')}${cf(i, "od", "Platí od", "date")}${cf(i, "do", "Platí do", "date")}
      ${cf(i, "sazba", "Sazba Kč/h", "number", 'min="0" step="10"')}${cf(i, "uvazek", "Úvazek (HPP/DPČ)", "text", 'inputmode="decimal" placeholder="1 nebo 0,5"')}${cf(i, "mzda", "Měsíční mzda (Kč)", "number", 'min="0" step="100"')}${cf(i, "limitMes", "Max h / měsíc", "number", 'min="0"')}

      if (p.typ === "z") { const rc = resolveContract(p.refId, L.projektId, L.datum, null), cs = contracts(o); csel = `<select class="csel" data-p="smlouvaId" data-i="${i}" title="Smlouva, na kterou se práce vykáže">${opt("", rc.c ? `smlouva: ${cLabel(rc.c)} (auto)` : "⚠ bez platné smlouvy")}${cs.map(c => opt(c.id, `${cLabel(c)}${c.od || c.do ? ` (${fmtD(c.od)}–${fmtD(c.do)})` : ""}`, p.smlouvaId === c.id)).join("")}</select>`; }
      const hTxt = num(p.hodiny) != null ? `${nf.format(num(p.hodiny))} h ručně` : `${fmtMin(partMin(L, p))} h`;
      return `<div class="row r-part part-${p.typ}"><span class="name">${esc(fullName(o))}<br><span class="sub">${p.typ === "z" ? "pracovník" : "klient " + esc((o && o.cislo) || "")}${p.typ === "k" && o && o.rodina ? " · " + esc(o.rodina) : ""}</span>${csel}</span>
      <select data-p="role" data-i="${i}">${roles.map(r => opt(r, r, p.role === r)).join("")}</select>
      <span class="num">${esc(fmtD(o && o.narozeni)) || "–"}</span>
      <label class="chk"><input type="checkbox" data-p="podpis" data-i="${i}"${p.podpis ? " checked" : ""}> ano</label>
      <label class="chk"><input type="checkbox" data-p="placena" data-i="${i}"${p.placena ? " checked" : ""}> ano</label>
      <button type="button" class="btn small${own ? " own" : ""}" data-p="cas" data-i="${i}" title="${own ? "Vlastní časy: " + esc(casyText(p.casy)) : "Podle časů listiny – klikni pro úpravu"}">${own ? "✎ " : ""}${hTxt}</button>
      <button type="button" class="x" data-p="del" data-i="${i}" title="Odebrat">✕</button></div>` +
      (openP === i ? `<div class="row pcas"><div><p class="sub" style="margin:0 0 6px">${own ? `Vlastní časy pro ${esc(fullName(o))}. Změny časů listiny se u něj už nepropíšou.` : ""}</p>${blkRows(p.casy || [], "pc", i)}
        <div class="chips" style="margin-top:6px"><button type="button" class="btn small" data-pc="add" data-i="${i}">+ Další čas</button><button type="button" class="btn small" data-pc="reset" data-i="${i}">Vrátit na časy listiny</button><button type="button" class="btn small" data-pc="close" data-i="${i}">Hotovo</button></div></div></div>` : "");
    }).join("") + `<div class="row"><label class="chk sub"><input type="checkbox" id="l_allSign"> všichni podepsali</label></div>` : `<div class="empty">Zatím nikdo. Přidej pracovníky a klienty.</div>`;
    const all = $("#l_allSign"); if (all) { all.checked = L.ucastnici.every(p => p.podpis); all.onchange = () => { L.ucastnici.forEach(p => p.podpis = all.checked); paintParts(); refresh(); }; }
  };
  const addPart = (typ, refId) => {
    if (L.ucastnici.some(p => p.typ === typ && p.refId === refId)) { toast("Už je na listině."); return; }
    let role;
    if (typ === "z") { const t = teamRow(P(), refId); role = t && ROLE_Z.includes(t.role) ? t.role : "mentor"; }
    else { const a = age((kli(refId) || {}).narozeni, L.datum); role = a != null && a < 18 ? "dítě" : "rodič"; }
    L.ucastnici.push({ typ, refId, role, podpis: false, placena: false });
    paintParts(); refresh();
  };
  // výběr účastníků
  let optList = [], act_i = 0;
  const paintOpts = () => {
    const q = norm($("#l_pick").value), box = $("#l_opts");
    if (!q) { box.classList.remove("open"); return; }
    const pr = P(), inTeam = z => !!teamRow(pr, z.id);
    const Z = S.zamestnanci.filter(z => z.aktivni !== false && norm(fullName(z) + " " + (z.jmeno || "") + " " + (z.prijmeni || "")).includes(q)).sort((a, b) => inTeam(b) - inTeam(a) || sortByName(a, b)).slice(0, 6);
    const K = S.klienti.filter(k => norm(fullName(k) + " " + (k.jmeno || "") + " " + (k.rodina || "") + " " + (k.cislo || "")).includes(q)).sort(sortByName).slice(0, 8);
    const F = families().filter(f => norm(f).includes(q)).slice(0, 3);
    optList = [
      ...F.map(f => ({ t: "f", f, l: `Celá rodina ${f}`, s: pl(S.klienti.filter(k => k.rodina === f && k.aktivni !== false).length, "člen", "členové", "členů") })),
      ...Z.map(z => ({ t: "z", id: z.id, l: fullName(z), s: `pracovník${inTeam(z) ? " · v týmu" : ""}` })),
      ...K.map(k => ({ t: "k", id: k.id, l: fullName(k), s: `${k.cislo || "klient"}${k.rodina ? " · " + k.rodina : ""}${k.narozeni ? " · " + fmtD(k.narozeni) : ""}` })),
      { t: "new", l: `＋ Nový klient „${$("#l_pick").value.trim()}“`, s: "" }
    ];
    act_i = 0;
    box.innerHTML = optList.map((o, i) => `<div class="opt${i === act_i ? " act" : ""}" data-o="${i}"><span>${esc(o.l)}</span><small>${esc(o.s)}</small></div>`).join("");
    box.classList.add("open");
  };
  const pickOpt = i => {
    const o = optList[i]; if (!o) return;
    $("#l_opts").classList.remove("open");
    const text = $("#l_pick").value.trim(); $("#l_pick").value = "";
    if (o.t === "z") addPart("z", o.id);
    else if (o.t === "k") addPart("k", o.id);
    else if (o.t === "f") S.klienti.filter(k => k.rodina === o.f && k.aktivni !== false).forEach(k => { if (!L.ucastnici.some(p => p.refId === k.id)) addPart("k", k.id); });
    else newClientInline(text);
    $("#l_pick").focus();
  };
  const newClientInline = text => {
    const parts = text.split(/\s+/).filter(Boolean);
    const box = $("#l_newk");
    box.innerHTML = `<div class="panel" style="margin-top:10px"><h3>Nový klient</h3><div class="form" style="margin-top:8px">
    <label>Jméno<input type="text" id="nk_j" value="${esc(parts.slice(1).join(" ") || "")}"></label><label>Příjmení<input type="text" id="nk_p" value="${esc(parts[0] || "")}"></label>
    <label>Datum narození<input type="date" id="nk_d"></label><label>Rodina<input type="text" id="nk_r" list="dl_rod2"></label>
    <datalist id="dl_rod2">${families().map(f => `<option value="${esc(f)}">`).join("")}</datalist></div><p class="err" id="nk_err"></p>
    <div class="actions" style="margin-top:6px"><button type="button" class="btn small" id="nk_x">Zrušit</button><button type="button" class="btn small primary" id="nk_ok">Přidat na listinu</button></div></div>`;
    $("#nk_p").focus();
    $("#nk_x").onclick = () => box.innerHTML = "";
    $("#nk_ok").onclick = () => {
      const K = { id: uid(), jmeno: val("nk_j"), prijmeni: val("nk_p"), narozeni: val("nk_d"), rodina: val("nk_r"), aktivni: true };
      if (!K.jmeno || !K.prijmeni) { $("#nk_err").textContent = "Vyplň jméno i příjmení."; return; }
      const same = S.klienti.find(x => norm(x.jmeno) === norm(K.jmeno) && norm(x.prijmeni) === norm(K.prijmeni));
      if (same && !$("#nk_ok").dataset.sure) { $("#nk_ok").dataset.sure = "1"; $("#nk_ok").textContent = "Přesto vytvořit nového"; $("#nk_err").textContent = `Klient ${fullName(same)}${same.narozeni ? " (" + fmtD(same.narozeni) + ")" : ""} už v evidenci je. Nechceš raději vybrat jeho?`; return; }
      save("klienti", K); box.innerHTML = ""; addPart("k", K.id);
    };
  };
  $("#l_pick").addEventListener("input", paintOpts);
  $("#l_pick").addEventListener("keydown", e => {
    const box = $("#l_opts"); if (!box.classList.contains("open")) return;
    if (e.key === "ArrowDown" || e.key === "ArrowUp") { e.preventDefault(); act_i = (act_i + (e.key === "ArrowDown" ? 1 : -1) + optList.length) % optList.length; $$(".opt", box).forEach((el, i) => el.classList.toggle("act", i === act_i)); }
    else if (e.key === "Enter") { e.preventDefault(); pickOpt(act_i); }
    else if (e.key === "Escape") { box.classList.remove("open"); }
  });
  $("#l_opts").addEventListener("mousedown", e => { const el = e.target.closest(".opt"); if (el) { e.preventDefault(); pickOpt(+el.dataset.o); } });
  $("#l_pick").addEventListener("blur", () => setTimeout(() => $("#l_opts") && $("#l_opts").classList.remove("open"), 150));
  $("#l_team").onclick = () => { const pr = P(); if (!pr || !(pr.tym || []).length) { toast("Projekt nemá tým. Přidej ho v nastavení projektu."); return; } pr.tym.forEach(t => { if (zam(t.zid) && !L.ucastnici.some(p => p.refId === t.zid)) addPart("z", t.zid); }); };
  // změny polí
  $("#l_parts").addEventListener("change", e => { const t = e.target.dataset.p, i = +e.target.dataset.i; if (!t || t === "del") return; L.ucastnici[i][t] = e.target.type === "checkbox" ? e.target.checked : e.target.value; if (t === "smlouvaId" && !e.target.value) delete L.ucastnici[i].smlouvaId; if (t === "podpis") { const a = $("#l_allSign"); if (a) a.checked = L.ucastnici.every(p => p.podpis); } refresh(); });
  $("#l_parts").addEventListener("input", e => { const k = e.target.dataset.pc; if (!k || k === "del") return; const p = L.ucastnici[+e.target.dataset.i]; p.casy[+e.target.dataset.j][k] = e.target.value; const row = e.target.closest(".r-cas"); const b = p.casy[+e.target.dataset.j]; row.children[3].textContent = blkMin(b) ? fmtMin(blkMin(b)) + " h" : "–"; const btn = $(`[data-p="cas"][data-i="${e.target.dataset.i}"]`); if (btn) btn.textContent = "✎ " + fmtMin(partMin(L, p)) + " h"; paintSum(); paintIss(); });
  $("#l_parts").addEventListener("click", e => {
    const t = e.target, i = +t.dataset.i;
    if (t.dataset.p === "del") { L.ucastnici.splice(i, 1); openP = -1; paintParts(); refresh(); return; }
    if (t.dataset.p === "cas") { const p = L.ucastnici[i]; if (!Array.isArray(p.casy)) { p.casy = clone(L.casy).filter(b => b.od || b.do).map(b => ({ ...b, id: uid() })); if (!p.casy.length) p.casy.push(newBlk([])); } delete p.hodiny; openP = openP === i ? -1 : i; paintParts(); refresh(); return; }
    const k = t.dataset.pc; if (!k) return; const p = L.ucastnici[i];
    if (k === "add") p.casy.push(newBlk(p.casy));
    else if (k === "del") p.casy.splice(+t.dataset.j, 1);
    else if (k === "reset") { delete p.casy; openP = -1; }
    else if (k === "close") openP = -1;
    paintParts(); refresh();
  });
  $("#l_casy").addEventListener("click", e => { if (e.target.dataset.lc === "del") { L.casy.splice(+e.target.dataset.j, 1); paintCasy(); paintParts(); refresh(); } });
  $("#l_casAdd").onclick = () => { L.casy.push(newBlk(L.casy)); paintCasy(); refresh(); $$("#l_casy select").pop().focus(); };
  $("#l_den").onchange = () => { L.denTyp = $("#l_den").value || null; if (!L.denTyp) delete L.denTyp; paintParts(); refresh(); };
  $("#lf").addEventListener("input", e => {
    const t = e.target;
    if (t.dataset.lc) { L.casy[+t.dataset.j][t.dataset.lc] = t.value; refresh(); $$('[data-p="cas"]').forEach(b => { const p = L.ucastnici[+b.dataset.i]; if (p && !Array.isArray(p.casy) && num(p.hodiny) == null) b.textContent = fmtMin(partMin(L, p)) + " h"; }); return; }
    if (t.dataset.pc) return;
    if (t.dataset.typ != null) { const i = +t.dataset.typ; L.typy = t.checked ? [...new Set([...L.typy, i])].sort((a, b) => a - b) : L.typy.filter(x => x !== i); paintIss(); return; }
    if (t.id === "l_nazev") L.nazev = t.value; else if (t.id === "l_datum") { L.datum = t.value; paintDen(); paintParts(); } else if (t.id === "l_misto") L.misto = t.value;
    else if (t.id === "l_popis") L.popis = t.value; else if (t.id === "l_zaver") L.zaver = t.value;
    else return;
    paintIss();
  });
  $("#l_proj").onchange = () => { L.projektId = $("#l_proj").value; L.typy = L.typy.filter(i => i < typyOf(P()).length); paintTypy(); paintParts(); refresh(); };
  // sken
  const paintScan = () => {
    if (mode === "gh") {   // na GitHubu se skeny neukládají – jen kde je papír / sken uložený
      $("#l_scan").innerHTML = `<label class="chk"><input type="checkbox" id="l_skOk"${L.sken ? " checked" : ""}> podepsaná listina je naskenovaná a založená</label><input type="text" class="grow" id="l_skLink" placeholder="kde je uložená (odkaz na sdílený disk, složka…)" value="${esc((L.sken && L.sken.link) || "")}">`;
      const upd = () => { L.sken = $("#l_skOk").checked || val("l_skLink") ? { name: "sken", link: val("l_skLink") } : null; paintIss(); };
      $("#l_skOk").onchange = upd; $("#l_skLink").oninput = () => { if (val("l_skLink")) $("#l_skOk").checked = true; upd(); };
      return;
    }
    const u = scanUrl(L.sken), isImg = L.sken && /^image\//.test(L.sken.type || "") ;
    $("#l_scan").innerHTML = (L.sken ? `${isImg && u ? `<img src="${esc(u)}" alt="Sken listiny" id="l_scanImg">` : `<span class="pill tag">📄 ${esc(L.sken.name || "soubor")}</span>`}${u && !isImg ? ` <a class="btn small" href="${esc(u)}" target="_blank" rel="noopener">Otevřít</a>` : ""} <button type="button" class="btn small" id="l_scanDel">Odebrat</button>` : "") +
      `<label class="btn small">${L.sken ? "Nahradit" : "Nahrát fotku / PDF"}<input type="file" id="l_scanFile" accept="image/*,application/pdf" hidden></label>${!ASSETS ? `<span class="sub">Bez sdíleného úložiště se ukládají jen menší fotky (do 1,5 MB).</span>` : ""}`;
    const img = $("#l_scanImg"); if (img) img.onclick = () => { $("#lbImg").src = img.src; $("#lightbox").classList.add("open"); };
    const del = $("#l_scanDel"); if (del) del.onclick = () => { L.sken = null; paintScan(); paintIss(); };
    $("#l_scanFile").onchange = async e => {
      const f = e.target.files[0]; if (!f) return;
      if (ASSETS) {
        $("#l_scan").insertAdjacentHTML("beforeend", `<span class="sub" id="l_up">Nahrávám…</span>`);
        try { const r = await ASSETS.upload(f); L.sken = { id: r.id, url: r.url, name: f.name, type: f.type || r.contentType }; }
        catch (err) { toast("Sken se nepodařilo nahrát."); }
      } else if (f.size <= 1.5 * 1024 * 1024) {
        L.sken = await new Promise(res => { const r = new FileReader(); r.onload = () => res({ data: r.result, name: f.name, type: f.type }); r.readAsDataURL(f); });
      } else { toast("Soubor je moc velký pro uložení v prohlížeči."); }
      paintScan(); paintIss();
    };
  };
  paintCasy(); paintDen(); paintTypy(); paintParts(); paintScan(); refresh();

  $("#l_cancel").onclick = closeDlg;
  $("#l_print").onclick = () => { const pr = P(); if (!pr) { toast("Vyber projekt."); return; } printDoc(listinaHtml(pr, L), `Listina_${L.datum || ""}_${(L.nazev || "").replace(/[^\w.-]+/g, "_").slice(0, 40)}.html`); };
  $("#l_save").onclick = () => {
    if (!L.projektId) { $("#l_err").textContent = "Vyber projekt."; return; }
    if (!L.datum) { $("#l_err").textContent = "Vyplň datum."; return; }
    const errs = checkListina(L).filter(i => i.lvl === "err");
    if (errs.length && !$("#l_save").dataset.sure) {
      $("#l_save").dataset.sure = "1"; $("#l_save").textContent = "Přesto uložit";
      $("#l_err").textContent = `Listina má ${pl(errs.length, "chybu", "chyby", "chyb")} (viz Kontroly výše). Oprav je, nebo ulož i tak – v přehledu zůstane označená.`;
      $("#l_iss").scrollIntoView({ block: "center", behavior: "smooth" });
      return;
    }
    if (!L.id) { L.id = uid(); L.vytvoreno = new Date().toISOString(); }
    L.casy = L.casy.filter(b => b.od || b.do);
    for (const p of L.ucastnici) if (Array.isArray(p.casy)) p.casy = p.casy.filter(b => b.od || b.do);
    try { localStorage.setItem("ep-lastProj", L.projektId); } catch (e) { }
    save("listiny", L); closeDlg(); toast(errs.length ? "Uloženo s chybami." : "Listina uložena.");
  };
  if (id) armDelete($("#l_del"), $("#l_err"), "Klikni znovu pro smazání listiny.", () => remove("listiny", id));
}

/* ---------- DIALOG: doplněná práce (mimo listiny) ---------- */
function aktDlg(id, preset) {
  const A = id ? clone(akt(id)) : Object.assign({ datum: today(), kategorie: AKT_KAT[0] }, preset || {});
  if (!A) return;
  if (!A.projektId) { const p = S.projekty.find(p => teamRow(p, A.zid)) || S.projekty[0]; A.projektId = p ? p.id : ""; }
  openDlg(`<h3>${id ? "Doplněná práce" : "Doplnit práci mimo listiny"}</h3><form class="form" id="af" novalidate>
  <label>Pracovník<select id="a_zid">${S.zamestnanci.filter(z => z.aktivni !== false || z.id === A.zid).sort(sortByName).map(z => opt(z.id, fullName(z), z.id === A.zid)).join("")}</select></label>
  <label>Projekt / podprojekt<select id="a_proj">${projTree().map(([p, d]) => opt(p.id, (d ? "↳ " : "") + projLabel(p), p.id === A.projektId)).join("")}</select></label>
  <label class="full">Smlouva<select id="a_sml"></select></label>
  <label>Kategorie<select id="a_kat">${AKT_KAT.map(k => opt(k, k, k === A.kategorie)).join("")}</select></label>
  <label>Datum<input type="date" id="a_datum" value="${esc(A.datum || "")}"></label>
  <label>Typ dne<select id="a_den"></select></label>
  <label>Místo<input type="text" id="a_misto" value="${esc(A.misto || "")}"></label>
  <label>Čas od<input type="time" id="a_od" value="${esc(A.od || "")}"></label>
  <label>Čas do<input type="time" id="a_do" value="${esc(A.do || "")}"></label>
  <label>Hodiny (jen když se liší od času)<input type="text" inputmode="decimal" id="a_h" value="${esc(String(A.hodiny ?? "").replace(".", ","))}"></label>
  <label class="full">Co dělal/a<textarea id="a_popis" rows="3">${esc(A.popis || "")}</textarea></label>
  <div class="sec">Kontroly</div><div class="full issues" id="a_iss"></div>
  </form><p class="err" id="a_err"></p>
  <div class="actions">${id ? `<button class="btn danger left" id="a_del">Smazat</button>` : ""}<button class="btn" id="a_cancel">Zrušit</button><button class="btn primary" id="a_save">Uložit</button></div>`, false, "#a_popis");
  const collect = () => Object.assign(A, { zid: val("a_zid"), projektId: val("a_proj"), smlouvaId: val("a_sml") || null, kategorie: val("a_kat"), datum: val("a_datum"), misto: val("a_misto"), od: val("a_od"), do: val("a_do"), hodiny: num(val("a_h")), popis: val("a_popis"), denTyp: val("a_den") || null });
  const paintSml = () => { const cur = $("#a_sml").value || A.smlouvaId || ""; const rc = resolveContract(val("a_zid"), val("a_proj"), val("a_datum"), null); $("#a_sml").innerHTML = opt("", rc.c ? `automaticky: ${cLabel(rc.c)}` : "⚠ bez platné smlouvy") + contracts(zam(val("a_zid"))).map(c => opt(c.id, `${cLabel(c)}${c.od || c.do ? ` (${fmtD(c.od)}–${fmtD(c.do)})` : ""}`, cur === c.id)).join(""); };
  const paintIss = () => { collect(); $("#a_iss").innerHTML = issuesHtml(checkAkt(A)); };
  const paintDen = () => { const cur = $("#a_den").value || A.denTyp || ""; $("#a_den").innerHTML = opt("", `automaticky: ${denAutoText(val("a_datum")) || "vyber datum"}`, !cur) + Object.entries(DEN_N).map(([k, n]) => opt(k, "ručně: " + n, cur === k)).join(""); };
  // čas předvyplněný podle obvyklé pracovní doby ze smlouvy
  const prefill = () => { if (id || $("#a_od").value || $("#a_do").value) return; const rc = resolveContract(val("a_zid"), val("a_proj"), val("a_datum"), val("a_sml") || null); if (rc.c && rc.c.pracOd) { $("#a_od").value = rc.c.pracOd; $("#a_do").value = rc.c.pracDo || ""; } };
  paintSml(); paintDen(); prefill(); paintIss();
  $("#af").addEventListener("input", paintIss); $("#af").addEventListener("change", e => { if (["a_zid", "a_proj", "a_datum"].includes(e.target.id)) paintSml(); if (e.target.id === "a_datum") paintDen(); if (["a_zid", "a_proj", "a_datum", "a_sml"].includes(e.target.id)) prefill(); paintIss(); });
  $("#a_cancel").onclick = closeDlg;
  $("#a_save").onclick = () => {
    collect();
    if (!A.zid || !A.projektId || !A.datum) { $("#a_err").textContent = "Vyplň pracovníka, projekt a datum."; return; }
    const errs = checkAkt(A).filter(i => i.lvl === "err");
    if (errs.length && !$("#a_save").dataset.sure) { $("#a_save").dataset.sure = "1"; $("#a_save").textContent = "Přesto uložit"; $("#a_err").textContent = `Záznam má ${pl(errs.length, "chybu", "chyby", "chyb")}. Oprav je, nebo ulož i tak.`; return; }
    if (!A.id) A.id = uid();
    save("aktivity", A); closeDlg(); toast("Práce doplněna.");
  };
  if (id) armDelete($("#a_del"), $("#a_err"), "Klikni znovu pro smazání.", () => remove("aktivity", id));
}

/* ---------- PRACOVNÍ VÝKAZY ---------- */
function stPill(x) {

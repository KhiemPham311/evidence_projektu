/* ============ GitHub úložiště se šifrováním ============
   Aplikace: veřejný repozitář (GitHub Pages), vedle index.html je pristupy.json.
   Data: soukromý repozitář, jeden soubor zašifrovaný klíčem K (AES-256-GCM).
   pristupy.json: pro každého uživatele "box" = {token, klíč K} zašifrovaný jeho heslem (PBKDF2 600 000× + AES-GCM).
   Bez hesla tedy nejde přečíst ani token, ani data – ani z veřejného souboru, ani z repozitáře s daty. */
const GHX = {
  sess: null,          // {name, admin, token, key(CryptoKey), keyB64, cfg:{owner,repo,branch,path}}
  acc: null,           // obsah pristupy.json
  accSha: null,
  sha: null,           // sha datového souboru
  queue: [], busy: false, timer: null, poll: null, idle: null
};
const GH_SESS = "ep-gh-session";
const GH_IDLE_MIN = 30;
const MIN_PASS = 12;
const isGhHost = () => !window.claude && /\.github\.io$/i.test(location.hostname);
const b64 = u8 => { let s = ""; const a = new Uint8Array(u8); for (let i = 0; i < a.length; i += 0x8000) s += String.fromCharCode.apply(null, a.subarray(i, i + 0x8000)); return btoa(s); };
const unb64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
const utf8b64 = s => b64(new TextEncoder().encode(s));
const b64utf8 = s => new TextDecoder().decode(unb64(s.replace(/\s/g, "")));
async function pwKey(pass, salt, iter) {
  const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(String(pass).normalize("NFC")), "PBKDF2", false, ["deriveKey"]);
  return crypto.subtle.deriveKey({ name: "PBKDF2", salt, iterations: iter, hash: "SHA-256" }, base, { name: "AES-GCM", length: 256 }, false, ["encrypt", "decrypt"]);
}
async function seal(key, text) { const iv = crypto.getRandomValues(new Uint8Array(12)); const ct = await crypto.subtle.encrypt({ name: "AES-GCM", iv }, key, new TextEncoder().encode(text)); return { iv: b64(iv), ct: b64(ct) }; }
async function unseal(key, box) { const pt = await crypto.subtle.decrypt({ name: "AES-GCM", iv: unb64(box.iv) }, key, unb64(box.ct)); return new TextDecoder().decode(pt); }
async function makeBox(pass, payload) { const salt = crypto.getRandomValues(new Uint8Array(16)), iter = 600000; return { salt: b64(salt), iter, ...(await seal(await pwKey(pass, salt, iter), JSON.stringify(payload))) }; }
async function openBox(pass, box) { return JSON.parse(await unseal(await pwKey(pass, unb64(box.salt), box.iter), box)); }
const importDataKey = kb64 => crypto.subtle.importKey("raw", unb64(kb64), { name: "AES-GCM" }, false, ["encrypt", "decrypt"]);

// kde aplikace běží: https://OWNER.github.io/REPO/slozka/ → owner, repo, složka
function appRepo() {
  const owner = location.hostname.split(".")[0];
  const segs = location.pathname.replace(/\/index\.html$/, "").split("/").filter(Boolean);
  if (!segs.length) return { owner, repo: `${owner}.github.io`, dir: "" };
  return { owner, repo: segs[0], dir: segs.slice(1).join("/") };
}
const accPath = () => { const a = appRepo(); return (a.dir ? a.dir + "/" : "") + "pristupy.json"; };
async function ghFetch(url, opts) { try { return await fetch(url, opts); } catch (e) { throw new Error("Nejde se spojit s GitHubem. Zkontroluj připojení k internetu."); } }
const ghHead = token => ({ Accept: "application/vnd.github+json", "X-GitHub-Api-Version": "2022-11-28", ...(token ? { Authorization: "Bearer " + token } : {}) });
const contentsUrl = (o, r, p) => `https://api.github.com/repos/${encodeURIComponent(o)}/${encodeURIComponent(r)}/contents/${p.split("/").map(encodeURIComponent).join("/")}`;
async function ghErr(r, what) {
  const t = await r.text().catch(() => "");
  if (r.status === 401) return new Error(`${what}: GitHub odmítl token (neplatný nebo vypršel).`);
  if (r.status === 403) return new Error(/rate limit/i.test(t) ? "GitHub dočasně omezil počet požadavků. Zkus to za pár minut." : `${what}: token nemá potřebná oprávnění.`);
  if (r.status === 404) return new Error(`${what}: repozitář nebo soubor nenalezen, nebo k němu token nemá přístup.`);
  return new Error(`${what}: chyba GitHubu ${r.status}.`);
}
// čtení souboru (i nad 1 MB přes blob)
async function ghGet(o, r, p, branch, token) {
  const res = await ghFetch(`${contentsUrl(o, r, p)}?ref=${encodeURIComponent(branch || "main")}&t=${Date.now()}`, { headers: ghHead(token), cache: "no-store" });
  if (res.status === 404) return null;
  if (!res.ok) throw await ghErr(res, "Čtení " + p);
  const j = await res.json();
  let content = j.content;
  if (!content && j.size > 0) {
    const b = await ghFetch(`https://api.github.com/repos/${encodeURIComponent(o)}/${encodeURIComponent(r)}/git/blobs/${j.sha}`, { headers: ghHead(token) });
    if (!b.ok) throw await ghErr(b, "Čtení " + p); content = (await b.json()).content;
  }
  return { sha: j.sha, text: b64utf8(content || "") };
}
async function ghPut(o, r, p, branch, token, text, sha, message) {
  const res = await ghFetch(contentsUrl(o, r, p), { method: "PUT", headers: { ...ghHead(token), "Content-Type": "application/json" }, body: JSON.stringify({ message, content: utf8b64(text), branch: branch || "main", ...(sha ? { sha } : {}) }) });
  if (res.status === 409 || res.status === 422) return { conflict: true };
  if (!res.ok) throw await ghErr(res, "Zápis " + p);
  return { sha: (await res.json()).content.sha };
}

/* ---------- pristupy.json ---------- */
async function loadAccess(token) {
  const a = appRepo();
  try { const f = await ghGet(a.owner, a.repo, accPath(), "main", token); if (f) { GHX.accSha = f.sha; return GHX.acc = JSON.parse(f.text); } }
  catch (e) { /* bez tokenu může dojít limit – zkusíme soubor přímo z Pages */ }
  try { const r = await fetch("pristupy.json?t=" + Date.now(), { cache: "no-store" }); if (r.ok) return GHX.acc = await r.json(); } catch (e) { }
  GHX.accSha = null; return GHX.acc = { v: 1, users: [] };
}
async function saveAccess(token, msg) {
  const a = appRepo(), text = JSON.stringify(GHX.acc, null, 1);
  for (let i = 0; i < 3; i++) {
    if (!GHX.accSha) { const f = await ghGet(a.owner, a.repo, accPath(), "main", token).catch(() => null); GHX.accSha = f ? f.sha : null; }
    const r = await ghPut(a.owner, a.repo, accPath(), "main", token, text, GHX.accSha, msg);
    if (!r.conflict) { GHX.accSha = r.sha; return; }
    GHX.accSha = null;
  }
  throw new Error("Soubor s přístupy se nepodařilo uložit (souběžná změna). Zkus to znovu.");
}

/* ---------- data ---------- */
async function readData() {
  const s = GHX.sess, c = s.cfg, f = await ghGet(c.owner, c.repo, c.path, c.branch, s.token);
  if (!f) return { sha: null, data: {} };
  const j = JSON.parse(f.text);
  if (!j.enc) throw new Error("Datový soubor není zašifrovaný – appka ho nepřijme.");
  return { sha: f.sha, data: JSON.parse(await unseal(s.key, j.enc)) };
}
async function writeData(data, sha, msg) {
  const s = GHX.sess, c = s.cfg;
  const body = JSON.stringify({ v: 1, app: "evidence-projektu", enc: await seal(s.key, JSON.stringify(data)) });
  return ghPut(c.owner, c.repo, c.path, c.branch, s.token, body, sha, msg);
}
function applyOps(base, ops) {
  const d = {}; for (const c of COLLS) d[c] = Array.isArray(base[c]) ? base[c].slice() : [];
  for (const op of ops) {
    if (op.t === "all") { for (const c of COLLS) d[c] = Array.isArray(op.data[c]) ? clone(op.data[c]) : []; continue; }
    if (op.t === "del") { d[op.c] = d[op.c].filter(x => x.id !== op.id); continue; }
    const rec = clone(op.rec);
    // jedinečná čísla: když mezitím někdo jiný použil stejné číslo, přidělí se další volné
    if ((op.c === "listiny" || op.c === "klienti") && rec.cislo && d[op.c].some(x => x.id !== rec.id && x.cislo === rec.cislo)) {
      const saved = S[op.c]; S[op.c] = d[op.c]; rec.cislo = nextNo(op.c, rec); S[op.c] = saved;
    }
    const i = d[op.c].findIndex(x => x.id === rec.id); if (i >= 0) d[op.c][i] = rec; else d[op.c].push(rec);
  }
  return d;
}
function ghQueue(op) { GHX.queue.push(op); paintSync("busy", "Neuloženo…"); clearTimeout(GHX.timer); GHX.timer = setTimeout(ghFlush, 700); }
async function ghFlush() {
  if (GHX.busy || !GHX.queue.length || !GHX.sess) return;
  GHX.busy = true; paintSync("busy", "Ukládám na GitHub…");
  const ops = GHX.queue.slice();
  try {
    for (let i = 0; i < 5; i++) {
      const cur = await readData();
      const merged = applyOps(cur.data, ops);
      const r = await writeData(merged, cur.sha, `${GHX.sess.name}: ${ops.length === 1 ? opText(ops[0]) : ops.length + " změn"}`);
      if (r.conflict) continue;
      GHX.sha = r.sha; GHX.queue.splice(0, ops.length);
      const view = applyOps(merged, GHX.queue);              // změny udělané během ukládání
      for (const c of COLLS) S[c] = view[c];
      renderKeep(); paintGhIdle();
      GHX.busy = false; if (GHX.queue.length) ghFlush();
      return;
    }
    throw new Error("Někdo jiný právě ukládá. Zkusím to znovu.");
  } catch (e) {
    GHX.busy = false; paintSync("err", "Neuloženo – zkouším znovu"); toast(e.message || "Uložení se nepodařilo.");
    clearTimeout(GHX.timer); GHX.timer = setTimeout(ghFlush, 15000);
  }
}
const opText = op => op.t === "all" ? "nahrání všech dat" : `${op.t === "del" ? "smazání" : "úprava"} ${({ projekty: "projektu", zamestnanci: "zaměstnance", klienti: "klienta", listiny: "listiny", aktivity: "práce", vykazy: "výkazu", nastaveni: "nastavení" })[op.c] || op.c}${op.rec && op.rec.cislo ? " " + op.rec.cislo : ""}`;
async function ghPoll() {
  if (!GHX.sess || GHX.busy || GHX.queue.length || document.hidden || $("#overlay").classList.contains("open")) return;
  try { const cur = await readData(); if (cur.sha !== GHX.sha) { GHX.sha = cur.sha; const d = applyOps(cur.data, []); for (const c of COLLS) S[c] = d[c]; renderKeep(); } paintGhIdle(); }
  catch (e) { paintSync("err", "GitHub nedostupný"); }
}
function paintGhIdle() { paintSync("ok", `GitHub · ${GHX.sess ? GHX.sess.name : ""}`); }

/* ---------- přihlášení, odhlášení, nečinnost ---------- */
async function startSession(name, admin, payload, cfg) {
  GHX.sess = { name, admin, token: payload.token, keyB64: payload.key, key: await importDataKey(payload.key), cfg };
  try { sessionStorage.setItem(GH_SESS, JSON.stringify({ name, admin, token: payload.token, key: payload.key, cfg })); } catch (e) { }
  paintSync("busy", "Načítám z GitHubu…");
  const cur = await readData();
  GHX.sha = cur.sha; const d = applyOps(cur.data, []); for (const c of COLLS) S[c] = d[c];
  mode = "gh"; hideLogin(); renderAll(); paintGhIdle(); migrate().then(ensureNumbers);
  clearInterval(GHX.poll); GHX.poll = setInterval(ghPoll, 45000);
  bumpIdle();
}
function ghLogout(reason) {
  if (GHX.queue.length && !reason) { toast("Počkej, ještě se ukládá…"); ghFlush(); return; }
  try { sessionStorage.removeItem(GH_SESS); } catch (e) { }
  GHX.sess = null; GHX.queue = []; clearInterval(GHX.poll); clearTimeout(GHX.idle);
  for (const c of COLLS) S[c] = [];
  closeDlg(); renderAll(); showLogin(reason);
}
function bumpIdle() { clearTimeout(GHX.idle); if (GHX.sess) GHX.idle = setTimeout(() => { if (GHX.queue.length) { ghFlush(); bumpIdle(); } else ghLogout(`Byl/a jsi odhlášen/a po ${GH_IDLE_MIN} minutách nečinnosti.`); }, GH_IDLE_MIN * 60000); }
["click", "keydown", "touchstart"].forEach(ev => document.addEventListener(ev, () => { if (GHX.sess) bumpIdle(); }, { passive: true }));
window.addEventListener("beforeunload", e => { if (GHX.queue.length) { e.preventDefault(); e.returnValue = ""; } });
document.addEventListener("visibilitychange", () => { if (!document.hidden) ghPoll(); });

function hideLogin() { const el = $("#login"); if (el) el.remove(); document.body.classList.remove("locked"); }
async function showLogin(msg) {
  document.body.classList.add("locked");
  let el = $("#login"); if (!el) { el = document.createElement("div"); el.id = "login"; el.className = "login"; document.body.appendChild(el); }
  el.innerHTML = `<div class="dialog"><h3>Evidence projektů</h3><p class="sub">Načítám…</p></div>`;
  const acc = await loadAccess();
  const users = (acc.users || []);
  if (!users.length) return showSetup(el);
  el.innerHTML = `<div class="dialog"><h3>Přihlášení</h3>${msg ? `<p class="note">${esc(msg)}</p>` : ""}
    <form class="form" id="lg" novalidate><label class="full">Jméno<select id="lg_name">${users.map(u => opt(u.id, u.name)).join("")}</select></label>
    <label class="full">Heslo<input type="password" id="lg_pass" autocomplete="current-password"></label>
    <div class="full"><button class="btn primary" type="submit" id="lg_ok">Přihlásit</button></div></form><p class="err" id="lg_err"></p>
    <p class="hint">Data jsou šifrovaná. Bez správného hesla je nejde přečíst. Zapomenuté heslo obnoví správce (nastaví nové).</p></div>`;
  $("#lg_pass").focus();
  $("#lg").onsubmit = async e => {
    e.preventDefault();
    const u = users.find(x => x.id === $("#lg_name").value), err = $("#lg_err");
    err.textContent = "Ověřuji heslo…"; $("#lg_ok").disabled = true;
    try { const p = await openBox($("#lg_pass").value, u.box); err.textContent = "Načítám data…"; await startSession(u.name, !!u.admin, p, acc.data); }
    catch (ex) { err.textContent = ex && ex.name === "OperationError" ? "Špatné heslo." : (ex.message || "Přihlášení se nepovedlo."); $("#lg_ok").disabled = false; }
  };
}
function showSetup(el) {
  const a = appRepo();
  el.innerHTML = `<div class="dialog wide"><h3>První spuštění – nastavení</h3>
  <p>Appka zatím nemá žádného uživatele. Nastav sebe jako správce. Postup krok za krokem je v souboru README.</p>
  <form class="form" id="su" novalidate>
    <div class="sec">Repozitář s daty (soukromý)</div>
    <label>Vlastník (uživatel GitHubu)<input type="text" id="su_owner" value="${esc(a.owner)}"></label>
    <label>Název soukromého repozitáře<input type="text" id="su_repo" value="evidence-projektu-data"></label>
    <div class="sec">Tvůj přístup</div>
    <label>Tvoje jméno<input type="text" id="su_name"></label>
    <label>Token (github_pat_…)<input type="password" id="su_token" autocomplete="off" spellcheck="false"></label>
    <label>Heslo (aspoň ${MIN_PASS} znaků)<input type="password" id="su_p1" autocomplete="new-password"></label>
    <label>Heslo znovu<input type="password" id="su_p2" autocomplete="new-password"></label>
    <p class="hint full">Token musí mít přístup k repozitáři s daty <b>i</b> k repozitáři s appkou (<span class="mono">${esc(a.owner)}/${esc(a.repo)}</span>), oprávnění <b>Contents: Read and write</b>. Heslo si dobře zapamatuj – je klíčem k datům.</p>
    <div class="full"><button class="btn primary" type="submit" id="su_ok">Nastavit a začít</button></div></form><p class="err" id="su_err"></p></div>`;
  $("#su").onsubmit = async e => {
    e.preventDefault();
    const err = $("#su_err"), cfg = { owner: val("su_owner"), repo: val("su_repo"), branch: "main", path: "data.json" }, name = val("su_name"), token = val("su_token"), p1 = $("#su_p1").value;
    if (!cfg.owner || !cfg.repo || !name || !token) { err.textContent = "Vyplň všechna pole."; return; }
    if (p1.length < MIN_PASS) { err.textContent = `Heslo musí mít aspoň ${MIN_PASS} znaků. Nejlepší je věta z několika slov.`; return; }
    if (p1 !== $("#su_p2").value) { err.textContent = "Hesla se neshodují."; return; }
    $("#su_ok").disabled = true;
    try {
      err.textContent = "Ověřuji token…";
      const r1 = await ghFetch(`https://api.github.com/repos/${encodeURIComponent(cfg.owner)}/${encodeURIComponent(cfg.repo)}`, { headers: ghHead(token) });
      if (!r1.ok) throw await ghErr(r1, "Repozitář s daty");
      const j1 = await r1.json();
      if (!j1.private) throw new Error("Repozitář s daty musí být SOUKROMÝ (Private). Změň to na GitHubu v Settings → Danger Zone.");
      if (j1.permissions && !j1.permissions.push) throw new Error("Token nemá právo zapisovat do repozitáře s daty.");
      const r2 = await ghFetch(`https://api.github.com/repos/${encodeURIComponent(a.owner)}/${encodeURIComponent(a.repo)}`, { headers: ghHead(token) });
      if (!r2.ok) throw await ghErr(r2, "Repozitář s appkou");
      const j2 = await r2.json(); if (j2.permissions && !j2.permissions.push) throw new Error("Token nemá právo zapisovat do repozitáře s appkou (kvůli souboru pristupy.json).");
      const existing = await ghGet(cfg.owner, cfg.repo, cfg.path, cfg.branch, token);
      if (existing) throw new Error("V repozitáři s daty už soubor data.json je. Bez původního klíče ho nejde otevřít – použij nový prázdný repozitář.");
      err.textContent = "Vytvářím šifrovací klíč…";
      const keyB64 = b64(crypto.getRandomValues(new Uint8Array(32)));
      GHX.sess = { name, admin: true, token, keyB64, key: await importDataKey(keyB64), cfg };
      const w = await writeData({}, null, `${name}: založení evidence`);
      if (w.conflict) throw new Error("Soubor s daty se nepodařilo založit.");
      GHX.acc = { v: 1, app: "evidence-projektu", data: cfg, users: [{ id: uid(), name, admin: true, added: today(), box: await makeBox(p1, { token, key: keyB64 }) }] };
      GHX.accSha = null; await saveAccess(token, `${name}: první nastavení přístupů`);
      err.textContent = "Hotovo, načítám…";
      await startSession(name, true, { token, key: keyB64 }, cfg);
      toast("Evidence je připravená. Data se ukládají zašifrovaně na GitHub.");
    } catch (ex) { GHX.sess = null; err.textContent = ex.message || "Nastavení se nepovedlo."; $("#su_ok").disabled = false; }
  };
}

/* ---------- správa přístupů (jen správce) ---------- */
function accessPanel() {
  if (mode !== "gh" || !GHX.sess) return "";
  const s = GHX.sess, users = (GHX.acc && GHX.acc.users) || [];
  return `<div class="panel"><h3>Účet a přístupy</h3><p>Přihlášen/a jako <b>${esc(s.name)}</b>${s.admin ? " (správce)" : ""}. Data jsou v soukromém repozitáři <span class="mono">${esc(s.cfg.owner)}/${esc(s.cfg.repo)}</span>, zašifrovaná. Po ${GH_IDLE_MIN} minutách nečinnosti nebo po zavření prohlížeče se appka odhlásí.</p>
  <div class="chips"><button class="btn" data-act="ghLogout">Odhlásit</button></div>
  ${s.admin ? `<div class="sheet" style="margin-top:12px">${users.map(u => `<div class="row r-acc"><span class="name">${esc(u.name)}${u.admin ? ` <span class="pill tag">správce</span>` : ""}</span><span class="sub">přidán/a ${esc(fmtD(u.added))}</span><button class="btn small" data-act="accPass" data-id="${u.id}">Nové heslo</button>${u.name === s.name ? "<span></span>" : `<button class="btn small danger" data-act="accDel" data-id="${u.id}">Odebrat</button>`}</div>`).join("")}</div>
  <div class="chips" style="margin-top:10px"><button class="btn primary" data-act="accAdd">+ Přidat člověka</button></div>
  <p class="hint">Každý člověk má vlastní token z GitHubu (fine-grained, jen repozitář s daty, Contents: Read and write, s expirací). Když někoho odebereš, zruš na GitHubu i jeho token.</p>` : ""}</div>`;
}
function accDlg(uidEdit) {
  const u = uidEdit ? GHX.acc.users.find(x => x.id === uidEdit) : null;
  openDlg(`<h3>${u ? "Nové heslo – " + esc(u.name) : "Přidat člověka"}</h3><form class="form" id="ac" novalidate>
    ${u ? "" : `<label>Jméno<input type="text" id="ac_name"></label><label class="chk" style="align-self:end"><input type="checkbox" id="ac_admin"> správce (může přidávat lidi)</label>`}
    <label class="full">Token tohoto člověka (github_pat_…)${u ? " – nechej prázdné, pokud se nemění" : ""}<input type="password" id="ac_token" autocomplete="off" spellcheck="false"></label>
    <label>Heslo (aspoň ${MIN_PASS} znaků)<input type="password" id="ac_p1" autocomplete="new-password"></label><label>Heslo znovu<input type="password" id="ac_p2" autocomplete="new-password"></label>
    <p class="hint full">Heslo mu předej osobně, ne e-mailem spolu s odkazem na appku.</p></form><p class="err" id="ac_err"></p>
    <div class="actions"><button class="btn" id="ac_x">Zrušit</button><button class="btn primary" id="ac_ok">Uložit</button></div>`, false, u ? "#ac_token" : "#ac_name");
  $("#ac_x").onclick = closeDlg;
  $("#ac_ok").onclick = async () => {
    const err = $("#ac_err"), s = GHX.sess, p1 = $("#ac_p1").value; let token = val("ac_token");
    if (!u && !val("ac_name")) { err.textContent = "Vyplň jméno."; return; }
    if (!u && GHX.acc.users.some(x => norm(x.name) === norm(val("ac_name")))) { err.textContent = "Člověk s tímto jménem už přístup má."; return; }
    if (p1.length < MIN_PASS) { err.textContent = `Heslo musí mít aspoň ${MIN_PASS} znaků.`; return; }
    if (p1 !== $("#ac_p2").value) { err.textContent = "Hesla se neshodují."; return; }
    if (u && !token) { if (u.name !== s.name) { err.textContent = "Pro změnu hesla jiného člověka zadej i jeho token (starý nejde bez jeho hesla přečíst)."; return; } token = s.token; }
    if (!token) { err.textContent = "Vyplň token."; return; }
    $("#ac_ok").disabled = true; err.textContent = "Ověřuji token…";
    try {
      const c = s.cfg, r = await ghFetch(`${contentsUrl(c.owner, c.repo, c.path)}?ref=${c.branch}`, { headers: ghHead(token) });
      if (!r.ok) throw await ghErr(r, "Token nemá přístup k datům");
      await loadAccess(s.token);
      const box = await makeBox(p1, { token, key: s.keyB64 });
      if (u) { const t = GHX.acc.users.find(x => x.id === u.id); if (t) t.box = box; }
      else GHX.acc.users.push({ id: uid(), name: val("ac_name"), admin: $("#ac_admin").checked, added: today(), box });
      await saveAccess(s.token, `${s.name}: ${u ? "nové heslo pro " + u.name : "přidán přístup " + val("ac_name")}`);
      closeDlg(); renderAll(); toast(u ? "Heslo změněno." : "Přístup přidán.");
    } catch (ex) { err.textContent = ex.message || "Nepovedlo se."; $("#ac_ok").disabled = false; }
  };
}
async function accRemove(id) {
  const s = GHX.sess; await loadAccess(s.token);
  const u = GHX.acc.users.find(x => x.id === id); if (!u) return;
  GHX.acc.users = GHX.acc.users.filter(x => x.id !== id);
  await saveAccess(s.token, `${s.name}: odebrán přístup ${u.name}`);
  renderAll(); toast(`Přístup odebrán. Zruš na GitHubu i token pro ${u.name}.`);
}
async function ghBoot() {
  let sv = null; try { sv = JSON.parse(sessionStorage.getItem(GH_SESS) || "null"); } catch (e) { }
  if (sv) { try { await loadAccess(sv.token); await startSession(sv.name, sv.admin, { token: sv.token, key: sv.key }, sv.cfg); return; } catch (e) { try { sessionStorage.removeItem(GH_SESS); } catch (x) { } } }
  showLogin();
}

if (isGhHost()) { route(); paintSync("busy", "Přihlášení…"); ghBoot(); }
else { loadLocal(); migrate().then(ensureNumbers); route(); syncIdle(); connectDb(); }

</script>
